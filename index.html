<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>走行評価イベントロガー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column cockpit. Sticky status bar, big tap targets (step 1 → 2 → 3), then the log table. */
:root {
  --bg: #eef1f3; --panel: #ffffff; --fg: #15202b; --muted: #5b6875; --line: #d3dae0;
  --accent: #0a6c8a; --accent-ink: #ffffff;
  --safe: #c62f2f; --eff: #c47a00; --viol: #3a4fb8; --una: #9c3d8f; --oth: #4f5d6b;
  --ok: #1d7a46; --warn: #b26b00; --bad: #b3261e;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1418; --panel: #182027; --fg: #e6ecf0; --muted: #94a2ae; --line: #2b3640;
  --accent: #3fb3d6; --accent-ink: #06151b;
  --safe: #ef5a5a; --eff: #f0a62a; --viol: #7f90f0; --una: #d77ccb; --oth: #7d8d9c;
  --ok: #4cc17f; --warn: #f0a62a; --bad: #ef5a5a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #182027; --fg: #e6ecf0; --muted: #94a2ae; --line: #2b3640;
  --accent: #3fb3d6; --accent-ink: #06151b;
  --safe: #ef5a5a; --eff: #f0a62a; --viol: #7f90f0; --una: #d77ccb; --oth: #7d8d9c;
  --ok: #4cc17f; --warn: #f0a62a; --bad: #ef5a5a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px; display: grid; gap: 16px }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px }
header .in { max-width: 860px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px }
h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .02em; margin-right: auto }
.clock { font-family: var(--font-mono); font-size: 18px; font-variant-numeric: tabular-nums }
.gps { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted) }
.gps[data-s="ok"] .dot { background: var(--ok) } .gps[data-s="weak"] .dot { background: var(--warn) } .gps[data-s="none"] .dot { background: var(--bad) }
.wrap > * { min-width: 0 }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px }
.grid { display: grid; gap: 10px }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)) }
.g5 { grid-template-columns: repeat(5, minmax(0,1fr)) }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)) }
.gs { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)) }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel) }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.in2 { max-width: 860px; margin: 8px auto 0 }
#car { min-height: 38px; padding: 6px 10px; flex: 1 1 auto; min-width: 0 }
.carrow { display: flex; gap: 8px; align-items: stretch }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none }
.tabs button { border: 0; border-radius: 0; padding: 0 14px; font-weight: 600; min-height: 38px; background: var(--panel); color: var(--muted) }
.tabs button.on { background: var(--accent); color: var(--accent-ink) }
#sumView .grid > * { min-width: 0 }
.filters { display: flex; flex-wrap: wrap; gap: 10px }
.filters label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; flex: 1 1 160px; min-width: 0 }
.sumhead { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 10px }
.sumhead .label { margin: 0 }
table.sum td.n, table.sum th.n { text-align: right; font-family: var(--font-mono); font-size: 12px }
table.sum td.z { color: var(--muted) }
table.sum th.grp { text-align: center; border-left: 1px solid var(--line) }
table.sum .bl { border-left: 1px solid var(--line) }
table.sum tr.total td { font-weight: 700; background: var(--bg) }
table.sum td.t, table.sum th.t { font-weight: 700 }
.cat { min-height: 72px; font-size: 18px; font-weight: 700; border: 0; color: #fff; display: grid; place-items: center; line-height: 1.2; padding: 8px }
.cat small { display: block; font-size: 11px; font-weight: 400; opacity: .9; margin-top: 4px }
.cat[data-c="safe"] { background: var(--safe) } .cat[data-c="eff"] { background: var(--eff) } .cat[data-c="viol"] { background: var(--viol) } .cat[data-c="una"] { background: var(--una) } .cat[data-c="oth"] { background: var(--oth) }
:root[data-theme="dark"] .cat, :root:not([data-theme="light"]) .cat { color: #fff }
.cat:active { transform: scale(.97) }
.opt { min-height: 60px; font-size: 16px; font-weight: 600; padding: 8px }
.opt.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.cur { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; padding: 10px 12px; border-radius: 8px; background: var(--bg); margin-bottom: 12px; font-variant-numeric: tabular-nums }
.cur b { font-size: 17px }
.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; color: #fff }
.chip[data-c="safe"] { background: var(--safe) } .chip[data-c="eff"] { background: var(--eff) } .chip[data-c="viol"] { background: var(--viol) } .chip[data-c="una"] { background: var(--una) } .chip[data-c="oth"] { background: var(--oth) }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.btn { padding: 10px 16px; font-weight: 600; min-height: 44px }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--bad); border-color: var(--bad) }
.btn.ghost { background: transparent }
input[type=text], select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 44px; width: 100% }
.memo { flex: 1 1 220px; min-width: 0 }
.step + .step { margin-top: 14px }
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel) }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); position: sticky; top: 0 }
td.num { font-family: var(--font-mono); font-size: 12px }
td.memo-c { white-space: normal; min-width: 140px }
tr.pending td { background: color-mix(in srgb, var(--warn) 12%, transparent) }
td a { color: var(--accent) }
.act button { padding: 6px 10px; font-size: 12px; min-height: 34px }
.empty { padding: 24px; text-align: center; color: var(--muted) }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px) }
.modal { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, #000 45%, transparent); display: grid; place-items: center; padding: 16px }
.modal .box { background: var(--panel); border-radius: 10px; padding: 16px; width: min(440px, 100%); display: grid; gap: 12px; max-height: 90%; overflow: auto }
.modal label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600 }
.note { font-size: 12px; color: var(--muted); margin: 0 }
textarea#fallback { width: 100%; height: 120px; font-family: var(--font-mono); font-size: 12px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px }
@media (max-width: 420px) { .cat { min-height: 64px; font-size: 14px; padding: 4px } #cats { gap: 6px } .cat small { display: none } h1 { font-size: 14px } .clock { font-size: 15px } .gs { grid-template-columns: repeat(2, minmax(0,1fr)) } }
@media (max-width: 380px) { .cat { font-size: 13px; padding: 2px; letter-spacing: -.02em; white-space: nowrap } }
@media (prefers-reduced-motion: reduce) { .cat:active { transform: none } }
</style>

</head><body>
<header><div class="in">
  <h1>走行評価イベントロガー</h1>
  <span class="gps" id="gps" data-s="wait"><span class="dot"></span><span id="gpsText">位置情報 取得中…</span></span>
  <span class="clock" id="clock">--:--:--</span>
</div>
<div class="in2 carrow"><input type="text" id="car" placeholder="車名（この後の記録に付きます）" autocomplete="off" aria-label="車名">
  <nav class="tabs" id="tabs"><button data-v="log" class="on" aria-pressed="true">記録</button><button data-v="sum" aria-pressed="false">集計</button></nav></div>
<div class="in2" id="stepCat">
  <div class="grid g5" id="cats" aria-label="① イベント分類（押した時刻と位置を記録）"></div>
</div></header>

<div class="wrap">

  <section class="panel" id="stepDetail" hidden>
    <div class="cur" id="curInfo"></div>
    <div class="step">
      <p class="label">② 詳細</p>
      <div class="grid gs" id="subs"></div>
    </div>
    <div class="step" id="stepRoad">
      <p class="label">③ 道路</p>
      <div class="grid g2" id="roads"></div>
    </div>
    <div class="step" id="stepScene">
      <p class="label">④ シーン</p>
      <div class="grid gs" id="scenes"></div>
    </div>
    <div class="step row">
      <input type="text" id="memo" class="memo" placeholder="メモ（任意）" autocomplete="off">
      <button class="btn primary" id="done">記録を確定</button>
      <button class="btn danger ghost" id="cancel">取り消す</button>
    </div>
    <p class="note" style="margin-top:10px">「記録を確定」を押すまでは記録されません。確定せずに分類ボタンやタブを切り替えると、入力中の内容は破棄されます。</p>
  </section>

  <section id="logView">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <p class="label" style="margin:0">記録一覧 <span id="count"></span></p>
      <div class="row">
        <button class="btn primary" id="copy">表をコピー（Excel貼付用）</button>
        <button class="btn danger ghost" id="clearAll">全削除</button>
      </div>
    </div>
    <div class="tablebox"><table>
      <thead><tr><th>No</th><th>日付</th><th>時刻</th><th>車名</th><th>分類</th><th>詳細</th><th>道路</th><th>シーン</th><th>地図</th><th>緯度</th><th>経度</th><th>精度(m)</th><th>位置の遅れ(秒)</th><th>メモ</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
  </section>

  <section id="sumView" hidden>
    <div class="grid" style="gap:16px">
      <div class="filters">
        <label>日付<select id="fDate"></select></label>
        <label>道路<select id="fRoad"></select></label>
        <label>車名<select id="fCar"></select></label>
      </div>
      <section class="panel">
        <div class="sumhead"><p class="label">日付・車名別の件数 <span id="sumCount"></span></p><button class="btn primary" id="copySum1">表をコピー</button></div>
        <div class="tablebox"><table class="sum" id="sum1"></table></div>
      </section>
      <section class="panel">
        <div class="sumhead"><p class="label">シーン別の件数</p><button class="btn primary" id="copySum2">表をコピー</button></div>
        <div class="tablebox"><table class="sum" id="sum2"></table></div>
      </section>
    </div>
  </section>
  <textarea id="fallback" hidden readonly aria-label="コピー用テキスト"></textarea>
</div>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const CATS = [
  { id: "safe", name: "安全T/O", subs: ["危険度 高", "危険度 中", "危険度 低"] },
  { id: "eff",  name: "効率T/O", subs: ["発進しない", "加速しない"] },
  { id: "viol", name: "交通違反", subs: ["信号無視", "実線を踏む", "速度超過", "歩行者保護違反"] },
  { id: "una",  name: "不要作動", subs: ["不要減速", "不要加速", "不要操舵"] },
  { id: "oth",  name: "その他", subs: ["計測開始", "計測終了", "システム退出"], noScene: true }, // no road / scene step
];
const ROADS = ["高速道", "一般道"];
const SCENES = ["巡行", "発進・加速", "減速", "右折", "左折", "Uターン", "合流・分岐", "ナビLC", "追い越し", "主動回避", "受動回避", "横断", "ラウンドアバウト"];
// scene names used by earlier versions, mapped to their current names
const SCENE_RENAMES = { "巡行・発進": "巡行", "追従加速": "発進・加速", "割り込まれ": "受動回避", "ナビレーンチェンジ": "ナビLC" };
const KEY = "drive-event-logger-v1";
const CAR_KEY = "drive-event-logger-car";
const $ = (id) => document.getElementById(id);

let records = load();
records.forEach(r => { if (SCENE_RENAMES[r.scene]) r.scene = SCENE_RENAMES[r.scene] });
let draft = null;     // record being filled in; joins records only on 記録を確定
let fix = null;       // latest GeolocationPosition

function load() { try { return JSON.parse(localStorage.getItem(KEY) || "[]") } catch { return [] } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(records)) } catch { toast("この端末では保存できません（プライベートモード等）") } }
const pad = (n) => String(n).padStart(2, "0");
const fmtDate = (t) => { const d = new Date(t); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}` };
const fmtTime = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` };
const catOf = (id) => CATS.find(c => c.id === id);
// Google Maps pin link (GPS coordinates are WGS84, which Google Maps uses as-is).
// Baidu Maps uses BD-09. Inside mainland China convert WGS84 → GCJ-02 → BD-09 here
// (standard formulas) instead of relying on Baidu's own conversion; outside China pass WGS84.
function wgsToBd(lat, lon) {
  if (lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271) return null;
  const a = 6378245.0, ee = 0.00669342162296594323, PI = Math.PI, x = lon - 105, y = lat - 35;
  let dLat = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x))
    + (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3
    + (20 * Math.sin(y * PI) + 40 * Math.sin(y / 3 * PI)) * 2 / 3
    + (160 * Math.sin(y / 12 * PI) + 320 * Math.sin(y * PI / 30)) * 2 / 3;
  let dLon = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x))
    + (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3
    + (20 * Math.sin(x * PI) + 40 * Math.sin(x / 3 * PI)) * 2 / 3
    + (150 * Math.sin(x / 12 * PI) + 300 * Math.sin(x / 30 * PI)) * 2 / 3;
  const rad = lat / 180 * PI, m = 1 - ee * Math.sin(rad) ** 2, sm = Math.sqrt(m);
  const gLat = lat + dLat * 180 / ((a * (1 - ee)) / (m * sm) * PI);
  const gLon = lon + dLon * 180 / (a / sm * Math.cos(rad) * PI);
  const X = PI * 3000 / 180, z = Math.sqrt(gLon * gLon + gLat * gLat) + 0.00002 * Math.sin(gLat * X);
  const th = Math.atan2(gLat, gLon) + 0.000003 * Math.cos(gLon * X);
  return { lat: +(z * Math.sin(th) + 0.006).toFixed(6), lon: +(z * Math.cos(th) + 0.0065).toFixed(6) };
}
function baiduUrl(r) {
  const bd = wgsToBd(r.lat, r.lon);
  const loc = bd ? `${bd.lat},${bd.lon}&coord_type=bd09ll` : `${r.lat},${r.lon}&coord_type=wgs84`;
  const title = encodeURIComponent(`${catOf(r.cat).name} ${r.sub || ""}`.trim());
  const content = encodeURIComponent(`${fmtDate(r.t)} ${fmtTime(r.t)}${r.car ? " " + r.car : ""}`);
  // src must follow Baidu's "webapp.<company>.<app>" format or the page may refuse to load
  return `https://api.map.baidu.com/marker?location=${loc}&title=${title}&content=${content}&output=html&src=webapp.drivelogger.eventlogger`;
}
const mapLinks = (r) => `<a href="${esc(baiduUrl(r))}" target="_blank" rel="noopener">Baidu地図</a>`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* ---- car name (kept across reloads, stamped on each new record) ---- */
try { $("car").value = localStorage.getItem(CAR_KEY) || "" } catch {}
$("car").addEventListener("input", () => { try { localStorage.setItem(CAR_KEY, $("car").value) } catch {} });

/* ---- clock & GPS ---- */
setInterval(() => { $("clock").textContent = fmtTime(Date.now()); renderGps() }, 500);

function renderGps() {
  const el = $("gps");
  if (!("geolocation" in navigator)) { el.dataset.s = "none"; $("gpsText").textContent = "位置情報 非対応"; return }
  if (gpsError) { el.dataset.s = "none"; $("gpsText").textContent = gpsError; return }
  if (!fix) return;
  const age = (Date.now() - fix.timestamp) / 1000, acc = fix.coords.accuracy;
  el.dataset.s = age < 10 && acc <= 30 ? "ok" : "weak";
  $("gpsText").textContent = `±${Math.round(acc)}m · ${age < 1 ? "最新" : Math.round(age) + "秒前"}`;
}
let gpsError = "";
if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(
    (p) => { fix = p; gpsError = ""; renderGps() },
    (e) => { gpsError = e.code === 1 ? "位置情報 許可されていません" : "位置情報 取得できません"; renderGps() },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
  );
}
// keep the screen on while logging (ignored where unsupported)
async function wake() { try { await navigator.wakeLock?.request("screen") } catch {} }
document.addEventListener("visibilitychange", () => { if (!document.hidden) wake() });
wake();

function applyFix(rec, p) {
  rec.lat = +p.coords.latitude.toFixed(7); rec.lon = +p.coords.longitude.toFixed(7);
  rec.acc = Math.round(p.coords.accuracy);
  rec.lag = Math.round((p.timestamp - rec.t) / 100) / 10; // >0: fix came after tap, <0: before
}

/* ---- step 1: category ---- */
$("cats").innerHTML = CATS.map(c => `<button class="cat" data-c="${c.id}">${c.name}<small>${c.subs.join(" / ")}</small></button>`).join("");
$("cats").addEventListener("click", (e) => {
  const b = e.target.closest(".cat"); if (!b) return;
  const t = Date.now();
  const rec = { id: t.toString(36) + Math.random().toString(36).slice(2, 6), t, cat: b.dataset.c, car: $("car").value.trim(), sub: "", road: "", scene: "", memo: "", lat: null, lon: null, acc: null, lag: null };
  if (fix && t - fix.timestamp < 15000) applyFix(rec, fix);
  else if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition((p) => {
      if (rec.lat != null) return;
      applyFix(rec, p);
      if (records.includes(rec)) { save(); renderTable() } else if (draft === rec) openDetail();
    }, () => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  }
  draft = rec; // replaces any unconfirmed draft
  if (navigator.vibrate) navigator.vibrate(40);
  openDetail(true);
});

/* ---- step 2/3 ---- */
// scrollToTop: only when the panel opens; picking options must not jump the page back up
function openDetail(scrollToTop = false) {
  const r = draft;
  if (!r) { $("stepDetail").hidden = true; return }
  const c = catOf(r.cat);
  $("stepDetail").hidden = false;
  $("curInfo").innerHTML = `<span class="chip" data-c="${c.id}">${c.name}</span><b>${fmtTime(r.t)}</b><span class="note">No.${records.length + 1} ${r.lat != null ? `· ${r.lat.toFixed(5)}, ${r.lon.toFixed(5)} · ${mapLinks(r)}` : "· 位置取得中…"}</span>`;
  $("subs").innerHTML = c.subs.map(s => `<button class="opt${r.sub === s ? " sel" : ""}" data-v="${esc(s)}">${esc(s)}</button>`).join("");
  $("stepRoad").hidden = $("stepScene").hidden = !!c.noScene;
  $("roads").innerHTML = ROADS.map(s => `<button class="opt${r.road === s ? " sel" : ""}" data-v="${esc(s)}">${esc(s)}</button>`).join("");
  $("scenes").innerHTML = SCENES.map(s => `<button class="opt${r.scene === s ? " sel" : ""}" data-v="${esc(s)}">${esc(s)}</button>`).join("");
  $("memo").value = r.memo || "";
  if (!scrollToTop) return;
  const top = $("stepDetail").getBoundingClientRect().top - document.querySelector("header").offsetHeight - 8;
  if (top < 0 || top > innerHeight * 0.6) scrollTo({ top: scrollY + top, behavior: "smooth" });
}
function setField(field, v) {
  const r = draft; if (!r) return;
  r[field] = r[field] === v ? "" : v; openDetail();
  // after a scene is chosen, bring the confirm button into easy reach
  if ((field === "scene" && r.scene) || (field === "sub" && r.sub && catOf(r.cat).noScene)) {
    const b = $("done").getBoundingClientRect();
    if (b.bottom > innerHeight - 24) scrollTo({ top: scrollY + b.bottom - innerHeight + 96, behavior: "smooth" });
  }
}
$("subs").addEventListener("click", (e) => { const b = e.target.closest(".opt"); if (b) setField("sub", b.dataset.v) });
$("roads").addEventListener("click", (e) => { const b = e.target.closest(".opt"); if (b) setField("road", b.dataset.v) });
$("scenes").addEventListener("click", (e) => { const b = e.target.closest(".opt"); if (b) setField("scene", b.dataset.v) });
$("memo").addEventListener("input", () => { if (draft) draft.memo = $("memo").value });
function finish() {
  if (!draft) return;
  records.push(draft); save(); draft = null;
  $("stepDetail").hidden = true; toast("記録しました"); renderTable();
}
$("done").addEventListener("click", finish);
$("cancel").addEventListener("click", () => { draft = null; $("stepDetail").hidden = true; toast("取り消しました") });

/* ---- table ---- */
function renderTable() {
  renderSummary();
  $("count").textContent = records.length ? `（${records.length}件）` : "";
  if (!records.length) { $("tbody").innerHTML = `<tr><td colspan="15" class="empty">まだ記録がありません。上の分類ボタンを押すと、その時刻と位置で1件記録されます。</td></tr>`; return }
  $("tbody").innerHTML = records.map((r, i) => {
    const c = catOf(r.cat), pending = !r.sub || (!c.noScene && (!r.road || !r.scene));
    const map = r.lat != null ? mapLinks(r) : "—";
    return `<tr class="${pending ? "pending" : ""}" data-id="${r.id}">
      <td class="num">${i + 1}</td><td class="num">${fmtDate(r.t)}</td><td class="num">${fmtTime(r.t)}</td><td>${esc(r.car) || "—"}</td>
      <td><span class="chip" data-c="${c.id}">${c.name}</span></td><td>${esc(r.sub) || "—"}</td><td>${esc(r.road) || "—"}</td><td>${esc(r.scene) || "—"}</td>
      <td>${map}</td><td class="num">${r.lat ?? "—"}</td><td class="num">${r.lon ?? "—"}</td><td class="num">${r.acc ?? "—"}</td><td class="num">${r.lag ?? "—"}</td>
      <td class="memo-c">${esc(r.memo)}</td>
      <td class="act"><div class="row" style="flex-wrap:nowrap;gap:6px"><button data-a="edit">編集</button><button data-a="del">削除</button></div></td></tr>`;
  }).join("");
}
$("tbody").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const id = b.closest("tr").dataset.id;
  if (b.dataset.a === "edit") editModal(id);
  else confirmModal("この記録を削除しますか？", () => { records = records.filter(x => x.id !== id); save(); renderTable() });
});

/* ---- modals ---- */
function closeModal() { $("modal").hidden = true; $("modal").innerHTML = "" }
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal() });
function confirmModal(msg, ok) {
  $("modal").innerHTML = `<div class="box"><b>${esc(msg)}</b><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="mNo">やめる</button><button class="btn danger" id="mYes">削除する</button></div></div>`;
  $("modal").hidden = false;
  $("mNo").onclick = closeModal; $("mYes").onclick = () => { ok(); closeModal(); toast("削除しました") };
}
function editModal(id) {
  const r = records.find(x => x.id === id); if (!r) return;
  const opts = (list, v) => `<option value="">（未選択）</option>` + list.map(s => `<option${s === v ? " selected" : ""}>${esc(s)}</option>`).join("");
  $("modal").innerHTML = `<div class="box">
    <b>No.${records.indexOf(r) + 1} を編集 <span class="note">${fmtDate(r.t)} ${fmtTime(r.t)}</span></b>
    <label>車名<input type="text" id="eCar" value="${esc(r.car)}"></label>
    <label>分類<select id="eCat">${CATS.map(c => `<option value="${c.id}"${c.id === r.cat ? " selected" : ""}>${c.name}</option>`).join("")}</select></label>
    <label>詳細<select id="eSub">${opts(catOf(r.cat).subs, r.sub)}</select></label>
    <label>道路<select id="eRoad">${opts(ROADS, r.road)}</select></label>
    <label>シーン<select id="eScene">${opts(SCENES, r.scene)}</select></label>
    <label>メモ<input type="text" id="eMemo" value="${esc(r.memo)}"></label>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="eNo">閉じる</button><button class="btn primary" id="eOk">保存</button></div></div>`;
  $("modal").hidden = false;
  $("eCat").onchange = () => { $("eSub").innerHTML = opts(catOf($("eCat").value).subs, "") };
  $("eNo").onclick = closeModal;
  $("eOk").onclick = () => {
    r.car = $("eCar").value.trim(); r.cat = $("eCat").value; r.sub = $("eSub").value; r.road = $("eRoad").value; r.scene = $("eScene").value; r.memo = $("eMemo").value;
    save(); renderTable(); closeModal(); toast("保存しました");
  };
}
$("clearAll").addEventListener("click", () => {
  if (!records.length) return;
  confirmModal(`全${records.length}件を削除しますか？（元に戻せません）`, () => { records = []; save(); renderTable() });
});

/* ---- copy as TSV ---- */
function tsv() {
  const clean = (s) => String(s ?? "").replace(/[\t\r\n]+/g, " ");
  const head = ["No", "日付", "時刻", "車名", "分類", "詳細", "道路", "シーン", "緯度", "経度", "精度(m)", "位置の遅れ(秒)", "メモ", "Baidu地図"];
  const rows = records.map((r, i) => [i + 1, fmtDate(r.t), fmtTime(r.t), r.car, catOf(r.cat).name, r.sub, r.road, r.scene, r.lat ?? "", r.lon ?? "", r.acc ?? "", r.lag ?? "", r.memo, r.lat != null ? baiduUrl(r) : ""].map(clean).join("\t"));
  return [head.join("\t"), ...rows].join("\n");
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); $("fallback").hidden = true; toast(okMsg) }
  catch {
    const ta = $("fallback"); ta.value = text; ta.hidden = false; ta.focus(); ta.select();
    let ok = false; try { ok = document.execCommand("copy") } catch {}
    toast(ok ? "コピーしました" : "下の枠を選択してコピーしてください");
  }
}
$("copy").addEventListener("click", () => {
  if (!records.length) { toast("記録がありません"); return }
  copyText(tsv(), `${records.length}件をコピーしました。Excelに貼り付けできます`);
});

/* ---- summary view ---- */
const NOCAR = "（車名なし）", NOROAD = "（道路未選択）", NOSCENE = "（シーン未選択）";
// columns: per category a total plus one per subtype
const COLS = CATS.flatMap(c => [{ cat: c.id, sub: null, label: "計", head: c.name + " 計" }, ...c.subs.map(s => ({ cat: c.id, sub: s, label: s, head: c.name + " " + s }))]);
const countCols = (list) => COLS.map(col => list.filter(r => r.cat === col.cat && (col.sub == null || r.sub === col.sub)).length);
const uniq = (a) => [...new Set(a)];
function setOptions(sel, values, allLabel) {
  const prev = sel.value;
  sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option>${esc(v)}</option>`).join("");
  sel.value = values.includes(prev) ? prev : "";
}
function filtered() {
  const d = $("fDate").value, c = $("fCar").value, rd = $("fRoad").value;
  return records.filter(r => (!d || fmtDate(r.t) === d) && (!c || (r.car || NOCAR) === c) && (!rd || (r.road || NOROAD) === rd));
}
function sumHead(firstCols) {
  const lead = firstCols.map(h => `<th rowspan="2">${h}</th>`).join("");
  return `<thead><tr>${lead}<th rowspan="2" class="n t">合計</th>${CATS.map(c => `<th class="grp" colspan="${c.subs.length + 1}">${c.name}</th>`).join("")}</tr>
    <tr>${COLS.map(col => `<th class="n${col.sub == null ? " bl t" : ""}">${esc(col.label)}</th>`).join("")}</tr></thead>`;
}
const cell = (n, cls = "") => `<td class="n${n ? "" : " z"}${cls}">${n}</td>`;
function sumRow(lead, list, cls = "") {
  return `<tr class="${cls}">${lead.map(v => `<td>${esc(v)}</td>`).join("")}${cell(list.length, " t")}${countCols(list).map((n, i) => cell(n, COLS[i].sub == null ? " bl t" : "")).join("")}</tr>`;
}
function groups() {
  const list = filtered();
  const keys = uniq(list.map(r => fmtDate(r.t) + "\u0000" + (r.car || NOCAR))).sort();
  return { list, rows: keys.map(k => { const [d, c] = k.split("\u0000"); return { d, c, items: list.filter(r => fmtDate(r.t) === d && (r.car || NOCAR) === c) } }) };
}
const sceneList = (list) => list.filter(r => !catOf(r.cat).noScene);
function sceneGroups(list) {
  list = sceneList(list);
  return [...SCENES, NOSCENE].map(s => ({ s, items: list.filter(r => (r.scene || NOSCENE) === s) })).filter(g => g.s !== NOSCENE || g.items.length);
}
function renderSummary() {
  if ($("sumView").hidden) return;
  setOptions($("fDate"), uniq(records.map(r => fmtDate(r.t))).sort().reverse(), "すべての日付");
  setOptions($("fRoad"), [...ROADS, NOROAD].filter(v => records.some(r => (r.road || NOROAD) === v)), "すべての道路");
  setOptions($("fCar"), uniq(records.map(r => r.car || NOCAR)).sort(), "すべての車");
  const { list, rows } = groups();
  $("sumCount").textContent = `（${list.length}件）`;
  if (!list.length) {
    const msg = `<tbody><tr><td class="empty">集計する記録がありません。「記録」タブで記録すると、日付と車名ごとにここへ集計されます。</td></tr></tbody>`;
    $("sum1").innerHTML = msg; $("sum2").innerHTML = msg; return;
  }
  $("sum1").innerHTML = sumHead(["日付", "車名"]) + "<tbody>" + rows.map(g => sumRow([g.d, g.c], g.items)).join("") + sumRow(["合計", ""], list, "total") + "</tbody>";
  $("sum2").innerHTML = sumHead(["シーン"]) + "<tbody>" + sceneGroups(list).map(g => sumRow([g.s], g.items)).join("") + sumRow(["合計"], sceneList(list), "total") + "</tbody>";
}
const tsvLine = (a) => a.map(v => String(v ?? "").replace(/[\t\r\n]+/g, " ")).join("\t");
const tsvCounts = (list) => [list.length, ...countCols(list)];
$("copySum1").addEventListener("click", () => {
  const { list, rows } = groups(); if (!list.length) { toast("記録がありません"); return }
  const lines = [tsvLine(["日付", "車名", "合計", ...COLS.map(c => c.head)]), ...rows.map(g => tsvLine([g.d, g.c, ...tsvCounts(g.items)])), tsvLine(["合計", "", ...tsvCounts(list)])];
  copyText(lines.join("\n"), "日付・車名別の集計をコピーしました");
});
$("copySum2").addEventListener("click", () => {
  const list = filtered(); if (!list.length) { toast("記録がありません"); return }
  const lines = [tsvLine(["シーン", "合計", ...COLS.map(c => c.head)]), ...sceneGroups(list).map(g => tsvLine([g.s, ...tsvCounts(g.items)])), tsvLine(["合計", ...tsvCounts(sceneList(list))])];
  copyText(lines.join("\n"), "シーン別の集計をコピーしました");
});
$("fDate").addEventListener("change", renderSummary);
$("fCar").addEventListener("change", renderSummary);
$("fRoad").addEventListener("change", renderSummary);

/* ---- tabs ---- */
function showView(v) {
  const sum = v === "sum";
  $("sumView").hidden = !sum; $("logView").hidden = sum; $("stepCat").hidden = sum;
  draft = null; // switching views drops an unconfirmed record
  $("stepDetail").hidden = true;
  $("fallback").hidden = true;
  document.querySelectorAll("#tabs button").forEach(b => { const on = b.dataset.v === v; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on) });
  if (sum) renderSummary();
  scrollTo({ top: 0 });
}
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-v]"); if (b) showView(b.dataset.v) });

/* ---- toast ---- */
let tt;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200) }

renderTable(); renderGps();
</script>

</body></html>
