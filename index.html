<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>試乗記録ツール</title>

<style>
/* Calm, card-based layout: one ink-coloured primary action, category colour only as accents. */
:root {
  --bg: #f4f3ef; --card: #ffffff; --fg: #141414; --muted: #8b8a85; --soft: #efeeea; --line: #e6e4de;
  --ink: #141414; --ink-fg: #ffffff;
  --safe: #e5484d; --comf: #12a594; --oth: #7c7b86; --good: #2f9e5f; --bad-c: #e5484d;
  --ok: #2f9e5f; --warn: #e2a336; --bad: #e5484d;
  --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 8px 24px rgb(0 0 0 / .06);
  --font-body: "Inter", "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0d0f; --card: #18181b; --fg: #f2f2f0; --muted: #8e8e93; --soft: #232327; --line: #2a2a2f;
  --ink: #f2f2f0; --ink-fg: #0d0d0f;
  --safe: #ff6369; --comf: #2ec7b1; --oth: #a1a0ab; --good: #4cc38a; --bad-c: #ff6369;
  --shadow: 0 1px 0 rgb(255 255 255 / .03) inset; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d0d0f; --card: #18181b; --fg: #f2f2f0; --muted: #8e8e93; --soft: #232327; --line: #2a2a2f;
  --ink: #f2f2f0; --ink-fg: #0d0d0f;
  --safe: #ff6369; --comf: #2ec7b1; --oth: #a1a0ab; --good: #4cc38a; --bad-c: #ff6369;
  --shadow: 0 1px 0 rgb(255 255 255 / .03) inset; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; letter-spacing: .01em;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent }
html:lang(zh-CN) body { font-family: "Inter", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0 }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

/* header */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)) }
header > * { max-width: 640px; margin-inline: auto }
.top { display: flex; align-items: center; gap: 10px }
h1 { font-size: 13px; font-weight: 600; margin: 0 auto 0 0; color: var(--muted); letter-spacing: .04em }
h1 b { color: var(--fg); font-weight: 700 }
.gps { display: inline-flex }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 0%, transparent) }
.gps[data-s="ok"] .dot { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 18%, transparent) }
.gps[data-s="weak"] .dot { background: var(--warn) } .gps[data-s="none"] .dot { background: var(--bad) }
.clock { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em }
.langbtn { font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 10px; border-radius: 99px; background: var(--soft); min-height: 30px }
#car { display: block; width: 100%; margin-top: 10px; font-family: inherit; color: var(--fg); border: 0; background: var(--soft); border-radius: 12px; padding: 10px 14px; min-height: 42px; font-size: 14px }

/* categories */
#cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px }
.cat { --c: var(--oth); position: relative; min-height: 84px; border-radius: 18px; padding: 12px; text-align: left; display: flex; flex-direction: column; justify-content: space-between;
  background: var(--card); box-shadow: var(--shadow); transition: transform .12s, background .15s, color .15s }
.cat[data-c="safe"] { --c: var(--safe) } .cat[data-c="comf"] { --c: var(--comf) } .cat[data-c="oth"] { --c: var(--oth) }
.cat::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c) }
.cat b { font-size: 17px; font-weight: 700; line-height: 1.2 }
.cat small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin-top: 2px }
.cat.on { background: var(--c); color: #fff } .cat.on::before { background: #fff } .cat.on small { color: rgb(255 255 255 / .8) }
.cat:active { transform: scale(.97) }

.wrap { max-width: 640px; margin: 0 auto; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 22px }
.wrap > * { min-width: 0 }
.card { background: var(--card); border-radius: 22px; padding: 16px; box-shadow: var(--shadow) }

/* entry sheet */
.cur { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px }
.cur .tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px }
.cur .tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c) }
.cur time { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted) }
.cur .no { margin-left: auto; font-size: 12px; color: var(--muted) }
#subs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--soft); border-radius: 16px }
#subs .opt { min-height: 60px; border-radius: 12px; font-size: 18px; font-weight: 700; color: var(--muted); transition: background .15s, color .15s }
#subs .opt.sel { background: var(--card); color: var(--fg); box-shadow: var(--shadow) }
#subs .opt[data-v="👍 Good"].sel { color: var(--good) } #subs .opt[data-v="👎 Bad"].sel { color: var(--bad-c) }
#memo { display: block; width: 100%; margin-top: 10px; border: 0; background: var(--soft); border-radius: 14px; padding: 12px 14px; min-height: 46px; font: inherit; color: var(--fg) }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); margin: 16px 0 8px }
#scenes { display: flex; flex-wrap: wrap; gap: 6px }
#scenes button { min-height: 36px; padding: 0 14px; border-radius: 99px; font-size: 13px; font-weight: 500; background: var(--soft); color: var(--fg) }
#scenes .opt.sel { background: var(--ink); color: var(--ink-fg) }
#scenes .more { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line) }
.actions { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 18px }
.btn { min-height: 44px; padding: 0 18px; border-radius: 99px; font-weight: 600; font-size: 14px }
.btn.primary { background: var(--ink); color: var(--ink-fg) }
.btn.ghost { color: var(--muted) }
.btn.soft { background: var(--soft) }
.btn.danger { color: var(--bad) }
.actions .btn { min-height: 52px; font-size: 16px }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px }

/* log */
.loghead { display: flex; align-items: center; gap: 4px; margin-bottom: 10px }
.loghead h2 { font-size: 20px; font-weight: 700; margin: 0 auto 0 4px; letter-spacing: -.01em }
.loghead #count { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 8px }
.list { display: grid; gap: 8px }
.item { --c: var(--oth); display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; background: var(--card); border-radius: 16px; padding: 12px 12px 12px 10px; box-shadow: var(--shadow) }
.item[data-c="safe"] { --c: var(--safe) } .item[data-c="comf"] { --c: var(--comf) }
.item .bar { align-self: stretch; border-radius: 4px; background: var(--c) }
.item .main { min-width: 0 }
.item .l1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap }
.item .l1 b { font-size: 15px }
.item .rate { font-size: 13px; font-weight: 600 }
.item .rate[data-v="👍 Good"] { color: var(--good) } .item .rate[data-v="👎 Bad"] { color: var(--bad-c) } .item .rate:empty::before { content: "—"; color: var(--muted) }
.item time { font-variant-numeric: tabular-nums }
.item .l2 { font-size: 13px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere }
.item .side { display: flex; gap: 2px }
.item .side a, .item .side button { font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px; border-radius: 10px; text-decoration: none; min-height: 34px; display: inline-flex; align-items: center }
.item .side a { color: var(--fg) }
.item.pending { box-shadow: var(--shadow), inset 0 0 0 1.5px color-mix(in srgb, var(--warn) 70%, transparent) }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px; border-radius: 16px; border: 1.5px dashed var(--line) }

/* event map */
.map { position: relative; height: 340px; overflow: hidden; border-radius: 14px; background: #e8e4da; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab }
.map.drag { cursor: grabbing }
.map img { position: absolute; width: 256px; height: 256px; max-width: none; pointer-events: none }
.map .pin { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; padding: 0; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.45); cursor: pointer }
.map .pin.sel { width: 26px; height: 26px; margin: -13px 0 0 -13px; z-index: 2; outline: 3px solid var(--fg); outline-offset: 1px }
.pin[data-c="safe"] { background: var(--safe) } .pin[data-c="comf"] { background: var(--comf) } .pin[data-c="oth"] { background: var(--oth) }
.map .zoom { position: absolute; right: 8px; top: 8px; z-index: 3; display: grid; gap: 6px }
.map .zoom button { width: 38px; height: 38px; padding: 0; font-size: 18px; font-weight: 700; background: var(--card); color: var(--fg); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.25) }
.map .zoom button.fit { font-size: 12px }
.map .offline { position: absolute; left: 0; right: 56px; top: 0; border-bottom-right-radius: 6px; z-index: 3; font-size: 12px; padding: 4px 8px; text-align: center; background: color-mix(in srgb, var(--warn) 88%, transparent); color: #fff; font-weight: 600 }
.map .credit { position: absolute; right: 0; bottom: 0; z-index: 3; font-size: 10px; padding: 1px 6px; background: rgba(255,255,255,.75); color: #333 }
.map .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--muted); background: var(--card); z-index: 4 }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted) }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px }
.mapinfo { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--soft); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-variant-numeric: tabular-nums }
.mapinfo a { color: var(--fg); font-weight: 600 }
.mapinfo .rate[data-v="👍 Good"] { color: var(--good) } .mapinfo .rate[data-v="👎 Bad"] { color: var(--bad-c) }
.maphead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px }
.maphead h2 { font-size: 20px; font-weight: 700; margin: 0 auto 0 4px; letter-spacing: -.01em }
.maphead #mapCount { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 8px }

/* overlays */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--ink-fg); padding: 10px 18px; border-radius: 99px; font-weight: 600; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); box-shadow: var(--shadow) }
.modal { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .4); display: grid; place-items: center; padding: 16px; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px) }
.modal .box { background: var(--card); border-radius: 22px; padding: 20px; width: min(420px, 100%); display: grid; gap: 12px; max-height: 90%; overflow: auto }
.modal .box > .btn { width: 100% }
.modal .btn:not(.primary):not(.ghost):not(.danger) { background: var(--soft) }
.modal .btn.danger { background: var(--bad); color: #fff }
.modal label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600 }
.modal input[type=text], .modal select { font: inherit; color: var(--fg); background: var(--soft); border: 0; border-radius: 12px; padding: 10px 12px; min-height: 44px; width: 100% }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.note { font-size: 13px; color: var(--muted); margin: 0 }
textarea#impText, textarea#fallback { width: 100%; height: 140px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--fg); background: var(--soft); border: 0; border-radius: 12px; padding: 10px }
@media (max-width: 360px) { .cat { min-height: 76px; padding: 10px } .cat b { font-size: 15px } .clock { font-size: 19px } }
@media (prefers-reduced-motion: reduce) { .cat, #subs .opt { transition: none } .cat:active { transform: none } }
</style>

</head><body>
<header>
  <div class="top">
    <h1><b data-zh="试驾记录工具">試乗記録ツール</b></h1>
    <span class="gps" id="gps" data-s="wait"><span class="dot"></span><span id="gpsText" class="sr"></span></span>
    <span class="clock" id="clock">--:--:--</span>
    <button class="langbtn" id="lang" type="button" aria-label="言語切替 / 切换语言"></button>
  </div>
  <input type="text" id="car" placeholder="車名" data-zh-ph="车名" autocomplete="off" aria-label="車名">
  <div id="cats"></div>
</header>

<div class="wrap">

  <section class="card" id="stepDetail" hidden>
    <div class="cur" id="curInfo"></div>
    <div id="subs"></div>
    <input type="text" id="memo" placeholder="コメント（任意）" data-zh-ph="备注（可选）" autocomplete="off" aria-label="コメント">
    <p class="label" data-zh="场景（可选）">シーン（任意）</p>
    <div id="scenes"></div>
    <div class="actions">
      <button class="btn ghost" id="cancel" data-zh="取消">取消</button>
      <button class="btn primary" id="done" data-zh="确认记录">記録する</button>
    </div>
  </section>

  <section id="logView">
    <div class="loghead">
      <h2><span data-zh="记录">記録</span><span id="count"></span></h2>
      <button class="btn sm ghost" id="import" data-zh="导入">取込</button>
      <button class="btn sm ghost" id="clearAll" data-zh="全部删除">全削除</button>
      <button class="btn sm primary" id="copy" data-zh="导出">エクスポート</button>
    </div>
    <div class="list" id="tbody"></div>
  </section>

  <section class="card" id="mapView">
    <div class="maphead">
      <h2><span data-zh="地图">地図</span><span id="mapCount"></span></h2>
      <button class="btn sm primary" id="saveMap" data-zh="保存图片">画像を保存</button>
    </div>
    <div class="map" id="map"></div>
    <div class="legend" id="mapLegend"></div>
    <div class="mapinfo" id="mapInfo" hidden></div>
  </section>

  <textarea id="fallback" hidden readonly aria-label="コピー用テキスト"></textarea>
</div>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
// Simple mode: three categories, each rated Good / Bad; scene and comment are optional
const RATES = ["👍 Good", "👎 Bad"];
const CATS = [
  { id: "safe", name: "安全・安心", en: "Safety", subs: RATES },
  { id: "comf", name: "快適", en: "Comfort", subs: RATES },
  { id: "oth",  name: "その他", en: "Other", subs: RATES },
];
const SCENES = ["巡行", "発進・加速", "減速", "右折", "左折", "Uターン", "合流・分岐", "ナビLC", "追い越し", "主動回避", "受動回避", "横断", "ラウンドアバウト"];
// scene names used by earlier versions, mapped to their current names
const SCENE_RENAMES = { "巡行・発進": "巡行", "追従加速": "発進・加速", "割り込まれ": "受動回避", "ナビレーンチェンジ": "ナビLC" };
// Records always store the Japanese names; ZH translates them (and fixed labels) for display.
const ZH = {
  "安全・安心": "安全・安心", "快適": "舒适", "その他": "其他",
  "巡行": "巡航", "発進・加速": "起步・加速", "減速": "减速", "右折": "右转", "左折": "左转", "Uターン": "掉头",
  "合流・分岐": "汇入・汇出", "ナビLC": "导航变道", "追い越し": "超车", "主動回避": "主动避让", "受動回避": "被动避让",
  "横断": "横穿", "ラウンドアバウト": "环岛",
};
const FROM_ZH = Object.fromEntries(Object.entries(ZH).map(([ja, zh]) => [zh, ja]));
// own storage keys so simple-mode records never mix with the full logger's
const KEY = "drive-event-logger-simple-v1";
const CAR_KEY = "drive-event-logger-simple-car";
const LANG_KEY = "drive-event-logger-simple-lang";
const $ = (id) => document.getElementById(id);

let lang = "ja";
try { if (localStorage.getItem(LANG_KEY) === "zh") lang = "zh" } catch {}
const tr = (ja, zh) => lang === "zh" ? zh : ja;        // fixed UI text
const L = (v) => lang === "zh" ? (ZH[v] ?? v) : v;      // stored category/rating/scene names

let records = load();
const SCENES_SHOWN = 5;
let scenesOpen = false;
let draft = null;     // record being filled in; joins records only on 記録を確定
let fix = null;       // latest GeolocationPosition

function load() { try { return JSON.parse(localStorage.getItem(KEY) || "[]") } catch { return [] } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(records)) } catch { toast(tr("この端末では保存できません（プライベートモード等）", "此设备无法保存（无痕模式等）")) } }
const pad = (n) => String(n).padStart(2, "0");
const fmtDate = (t) => { const d = new Date(t); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}` };
const fmtTime = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` };
const catOf = (id) => CATS.find(c => c.id === id);
// Amap uses GCJ-02. Inside mainland China convert WGS84 → GCJ-02 here (standard formula)
// instead of relying on Amap's own conversion; outside China GCJ-02 is WGS84 unchanged.
const inChina = (lat, lon) => !(lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271);
function wgsToGcj(lat, lon) {
  const a = 6378245.0, ee = 0.00669342162296594323, PI = Math.PI, x = lon - 105, y = lat - 35;
  let dLat = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x))
    + (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3
    + (20 * Math.sin(y * PI) + 40 * Math.sin(y / 3 * PI)) * 2 / 3
    + (160 * Math.sin(y / 12 * PI) + 320 * Math.sin(y * PI / 30)) * 2 / 3;
  let dLon = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x))
    + (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3
    + (20 * Math.sin(x * PI) + 40 * Math.sin(x / 3 * PI)) * 2 / 3
    + (150 * Math.sin(x / 12 * PI) + 300 * Math.sin(x / 30 * PI)) * 2 / 3;
  const rad = lat / 180 * PI, m = 1 - ee * Math.sin(rad) ** 2, sm = Math.sqrt(m);
  const gLat = lat + dLat * 180 / ((a * (1 - ee)) / (m * sm) * PI);
  const gLon = lon + dLon * 180 / (a / sm * Math.cos(rad) * PI);
  return { lat: gLat, lon: gLon };
}
// GCJ-02 → WGS84 by fixed-point iteration (sub-metre), for import
function gcjToWgs(lat, lon) {
  if (!inChina(lat, lon)) return { lat, lon };
  let w = { lat, lon };
  for (let i = 0; i < 10; i++) { const f = wgsToGcj(w.lat, w.lon); w = { lat: w.lat + lat - f.lat, lon: w.lon + lon - f.lon } }
  return { lat: +w.lat.toFixed(7), lon: +w.lon.toFixed(7) };
}
// BD-09 → GCJ-02 exactly, then GCJ-02 → WGS84; for Baidu links in copies made by earlier versions
function bdToWgs(lat, lon) {
  const X = Math.PI * 3000 / 180, x = lon - 0.0065, y = lat - 0.006;
  const z = Math.sqrt(x * x + y * y) - 0.00002 * Math.sin(y * X), th = Math.atan2(y, x) - 0.000003 * Math.cos(x * X);
  return gcjToWgs(z * Math.sin(th), z * Math.cos(th));
}
// position from a copied Amap (or older Baidu) link (the copy no longer carries latitude/longitude columns)
function posFromLink(url) {
  const a = String(url).match(/position=(-?[\d.]+),(-?[\d.]+)/);
  if (a) return /coordinate=wgs84/.test(url) ? { lat: +a[2], lon: +a[1] } : gcjToWgs(+a[2], +a[1]);
  const m = String(url).match(/location=(-?[\d.]+),(-?[\d.]+)&coord_type=(\w+)/); if (!m) return null;
  const lat = +m[1], lon = +m[2];
  return m[3] === "bd09ll" ? bdToWgs(lat, lon) : { lat, lon };
}
function amapUrl(r) {
  const g = inChina(r.lat, r.lon) ? wgsToGcj(r.lat, r.lon) : { lat: r.lat, lon: r.lon };
  // Amap cuts long pin names short, so the memo comes right after the category and the date/time is kept short
  const d = new Date(r.t), when = `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const name = encodeURIComponent([`${L(catOf(r.cat).name)} ${L(r.sub)}`.trim(), r.memo, r.car, when].filter(Boolean).join("｜").replace(/\s+/g, " "));
  return `https://uri.amap.com/marker?position=${g.lon.toFixed(6)},${g.lat.toFixed(6)}&name=${name}&coordinate=gaode&callnative=0&src=drivelogger`;
}
const mapLinks = (r) => `<a href="${esc(amapUrl(r))}" target="_blank" rel="noopener">${tr("地図", "地图")}</a>`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* ---- language ---- */
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "ja";
  document.querySelectorAll("[data-zh]").forEach(el => { if (el.dataset.ja == null) el.dataset.ja = el.textContent; el.textContent = lang === "zh" ? el.dataset.zh : el.dataset.ja });
  document.querySelectorAll("[data-zh-ph]").forEach(el => { if (el.dataset.jaPh == null) el.dataset.jaPh = el.placeholder; el.placeholder = lang === "zh" ? el.dataset.zhPh : el.dataset.jaPh });
  $("lang").textContent = lang === "zh" ? "日本語" : "中文";
  renderCats(); renderGps(); renderTable();
  if (draft) openDetail();
}
$("lang").addEventListener("click", () => {
  lang = lang === "zh" ? "ja" : "zh";
  try { localStorage.setItem(LANG_KEY, lang) } catch {}
  applyLang();
});

/* ---- car name (kept across reloads, stamped on each new record) ---- */
try { $("car").value = localStorage.getItem(CAR_KEY) || "" } catch {}

/* ---- clock & GPS ---- */
setInterval(() => { $("clock").textContent = fmtTime(Date.now()); renderGps() }, 500);

let gpsError = 0; // 0 none, 1 denied, 2 unavailable
function renderGps() {
  const el = $("gps");
  if (!("geolocation" in navigator)) { el.dataset.s = "none"; $("gpsText").textContent = tr("位置情報 非対応", "不支持定位"); return }
  if (gpsError) { el.dataset.s = "none"; $("gpsText").textContent = gpsError === 1 ? tr("位置情報 許可されていません", "定位未授权") : tr("位置情報 取得できません", "无法获取定位"); return }
  if (!fix) { $("gpsText").textContent = tr("位置情報 取得中…", "正在获取定位…"); return }
  const age = (Date.now() - fix.timestamp) / 1000, acc = fix.coords.accuracy;
  el.dataset.s = age < 10 && acc <= 30 ? "ok" : "weak";
  $("gpsText").textContent = `±${Math.round(acc)}m · ${age < 1 ? tr("最新", "最新") : Math.round(age) + tr("秒前", "秒前")}`;
}
if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(
    (p) => { fix = p; gpsError = 0; renderGps() },
    (e) => { gpsError = e.code === 1 ? 1 : 2; renderGps() },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
  );
}
// keep the screen on while logging (ignored where unsupported)
async function wake() { try { await navigator.wakeLock?.request("screen") } catch {} }
document.addEventListener("visibilitychange", () => { if (!document.hidden) wake() });
wake();

// only the position is kept, for the Amap link
function applyFix(rec, p) { rec.lat = +p.coords.latitude.toFixed(7); rec.lon = +p.coords.longitude.toFixed(7) }

/* ---- step 1: category ---- */
function renderCats() {
  $("cats").setAttribute("aria-label", tr("① イベント分類（押した時刻と位置を記録）", "① 事件分类（记录按下时的时间和位置）"));
  $("cats").innerHTML = CATS.map(c => `<button class="cat" data-c="${c.id}" aria-label="${esc(L(c.name))}"><span><b>${esc(L(c.name))}</b><small>${c.en}</small></span></button>`).join("");
}
$("cats").addEventListener("click", (e) => {
  const b = e.target.closest(".cat"); if (!b) return;
  const t = Date.now();
  const rec = { id: t.toString(36) + Math.random().toString(36).slice(2, 6), t, cat: b.dataset.c, car: $("car").value.trim(), sub: "", scene: "", memo: "", lat: null, lon: null };
  if (fix && t - fix.timestamp < 15000) applyFix(rec, fix);
  else if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition((p) => {
      if (rec.lat != null) return;
      applyFix(rec, p);
      if (records.includes(rec)) { save(); renderTable() } else if (draft === rec) openDetail();
    }, () => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  }
  draft = rec; // replaces any unconfirmed draft
  scenesOpen = false;
  if (navigator.vibrate) navigator.vibrate(40);
  openDetail(true);
});

/* ---- step 2/3 ---- */
const optBtns = (list, cur) => list.map(s => `<button class="opt${cur === s ? " sel" : ""}" data-v="${esc(s)}">${esc(L(s))}</button>`).join("");
// scrollToTop: only when the panel opens; picking options must not jump the page back up
function openDetail(scrollToTop = false) {
  const r = draft;
  document.querySelectorAll(".cat").forEach(b => b.classList.toggle("on", !!r && b.dataset.c === r.cat));
  if (!r) { $("stepDetail").hidden = true; return }
  const c = catOf(r.cat);
  $("stepDetail").hidden = false;
  $("curInfo").style.setProperty("--c", `var(--${c.id})`);
  $("curInfo").innerHTML = `<span class="tag">${esc(L(c.name))}</span><time>${fmtTime(r.t)}</time><span class="no">No.${records.length + 1}</span>`;
  $("subs").innerHTML = optBtns(c.subs, r.sub);
  // only the first few scenes until "more" is pressed, so the confirm button stays on one screen
  // (a chosen scene further down stays visible)
  const all = scenesOpen, shown = SCENES.filter((v, i) => all || i < SCENES_SHOWN || v === r.scene);
  $("scenes").innerHTML = optBtns(shown, r.scene)
    + `<button class="more" type="button">${all ? tr("閉じる", "收起") : tr(`ほか${SCENES.length - SCENES_SHOWN}件`, `其他${SCENES.length - SCENES_SHOWN}项`)}</button>`;
  $("memo").value = r.memo || "";
  if (!scrollToTop) return;
  const top = $("stepDetail").getBoundingClientRect().top - document.querySelector("header").offsetHeight - 8;
  if (top < 0 || top > innerHeight * 0.6) scrollTo({ top: scrollY + top, behavior: "smooth" });
}
function setField(field, v) {
  const r = draft; if (!r) return;
  r[field] = r[field] === v ? "" : v; openDetail();
  // after a rating is chosen, go straight to the comment
  if (field === "sub" && r.sub) { $("memo").focus({ preventScroll: true }); return }
  // after a scene is chosen, bring the confirm button into easy reach
  if (field === "scene" && r.scene) {
    const b = $("done").getBoundingClientRect();
    if (b.bottom > innerHeight - 24) scrollTo({ top: scrollY + b.bottom - innerHeight + 96, behavior: "smooth" });
  }
}
$("subs").addEventListener("click", (e) => { const b = e.target.closest(".opt"); if (b) setField("sub", b.dataset.v) });
$("scenes").addEventListener("click", (e) => {
  if (e.target.closest(".more")) { scenesOpen = !scenesOpen; openDetail(); return }
  const b = e.target.closest(".opt"); if (b) setField("scene", b.dataset.v);
});
$("memo").addEventListener("input", () => { if (draft) draft.memo = $("memo").value });
function finish() {
  if (!draft) return;
  records.push(draft); save(); draft = null;
  openDetail(); toast(tr("記録しました", "已记录")); renderTable();
}
$("done").addEventListener("click", finish);
$("cancel").addEventListener("click", () => { draft = null; openDetail(); toast(tr("取り消しました", "已取消")) });

/* ---- table ---- */
function renderTable() {
  $("count").textContent = records.length ? tr(`${records.length}件`, `${records.length}条`) : "";
  renderMap(records);
  if (!records.length) { $("tbody").innerHTML = `<p class="empty">${tr("まだ記録がありません。上の分類を押すと、その時刻と位置で記録が始まります。", "还没有记录。按上方的分类，即以当时的时间和位置开始记录。")}</p>`; return }
  $("tbody").innerHTML = records.map((r, i) => {
    const c = catOf(r.cat), sub = [L(r.scene), r.memo].filter(Boolean).map(esc).join(" · ");
    return `<div class="item${r.sub ? "" : " pending"}" data-c="${c.id}" data-id="${r.id}"><span class="bar"></span>
      <div class="main"><div class="l1"><b>${esc(L(c.name))}</b><span class="rate" data-v="${esc(r.sub)}">${esc(L(r.sub))}</span></div>
        <div class="l2"><time>${fmtTime(r.t)}</time> · No.${i + 1}${sub ? " · " + sub : ""}</div></div>
      <div class="side">${r.lat != null ? mapLinks(r) : ""}<button data-a="edit">${tr("編集", "编辑")}</button><button data-a="del">${tr("削除", "删除")}</button></div></div>`;
  }).reverse().join("");
}
$("tbody").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const id = b.closest("[data-id]").dataset.id;
  if (b.dataset.a === "edit") editModal(id);
  else confirmModal(tr("この記録を削除しますか？", "要删除这条记录吗？"), () => { records = records.filter(x => x.id !== id); save(); renderTable() });
});

/* ---- modals ---- */
function closeModal() { $("modal").hidden = true; $("modal").innerHTML = "" }
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal() });
function confirmModal(msg, ok) {

  $("modal").innerHTML = `<div class="box">
    <b>${tr(`No.${records.indexOf(r) + 1} を編集`, `编辑 No.${records.indexOf(r) + 1}`)} <span class="note">${fmtDate(r.t)} ${fmtTime(r.t)}</span></b>
    <label>${tr("車名", "车名")}<input type="text" id="eCar" value="${esc(r.car)}"></label>
    <label>${tr("分類", "分类")}<select id="eCat">${CATS.map(c => `<option value="${c.id}"${c.id === r.cat ? " selected" : ""}>${esc(L(c.name))}</option>`).join("")}</select></label>
    <label>${tr("評価", "评价")}<select id="eSub">${opts(catOf(r.cat).subs, r.sub)}</select></label>
    <label>${tr("シーン", "场景")}<select id="eScene">${opts(SCENES, r.scene)}</select></label>

    <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="eNo">${tr("閉じる", "关闭")}</button><button class="btn primary" id="eOk">${tr("保存", "保存")}</button></div></div>`;
  $("modal").hidden = false;
    $("eNo").onclick = closeModal;
  $("eOk").onclick = () => {
    r.car = $("eCar").value.trim(); r.cat = $("eCat").value; r.sub = $("eSub").value; r.scene = $("eScene").value; r.memo = $("eMemo").value;

$("clearAll").addEventListener("click", () => {
  if (!records.length) return;
  confirmModal(tr(`全${records.length}件を削除しますか？（元に戻せません）`, `要删除全部${records.length}条记录吗？（无法恢复）`), () => { records = []; save(); renderTable() });
});

/* ---- copy as TSV (in the current language; import accepts either) ---- */
const HEAD = [["No", "No"], ["日付", "日期"], ["時刻", "时间"], ["車名", "车名"], ["分類", "分类"], ["評価", "评价"], ["シーン", "场景"],
  ["コメント", "备注"], ["高徳地図", "高德地图"]];
// Baidu link column of copies made by earlier versions; still read when importing
const OLD_MAP_HEAD = ["Baidu地図", "百度地图"];
// empty cells are written as "-" in every copied table (import reads "-" back as empty)
const cellText = (v) => String(v ?? "").replace(/[\t\r\n]+/g, " ").trim() || "-";
// table rows (header first) shared by the clipboard copy and the Excel file
function recordRows() {
  const head = HEAD.map(h => tr(h[0], h[1]));
  return [head, ...records.map((r, i) => [i + 1, fmtDate(r.t), fmtTime(r.t), r.car, L(catOf(r.cat).name), L(r.sub), L(r.scene), r.memo, r.lat != null ? amapUrl(r) : ""])];
}
const toTsv = (rows) => rows.map(tsvLine).join("\n");
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); $("fallback").hidden = true; toast(okMsg) }
  catch {
    const ta = $("fallback"); ta.value = text; ta.hidden = false; ta.focus(); ta.select();
    let ok = false; try { ok = document.execCommand("copy") } catch {}
    toast(ok ? tr("コピーしました", "已复制") : tr("下の枠を選択してコピーしてください", "请选中下方文本框的内容并复制"));
  }
}
$("copy").addEventListener("click", () => {
  if (!records.length) { toast(tr("記録がありません", "没有记录")); return }
  $("modal").innerHTML = `<div class="box">
    <b>${tr("エクスポート", "导出")}</b>
    <p class="note">${tr(`${records.length}件の記録を出力します。`, `导出${records.length}条记录。`)}</p>
    <button class="btn primary" id="exXlsx">${tr("Excelファイルをダウンロード", "下载Excel文件")}</button>
    <button class="btn" id="exCopy">${tr("クリップボードにコピー", "复制到剪贴板")}</button>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="exNo">${tr("閉じる", "关闭")}</button></div></div>`;
  $("modal").hidden = false;
  $("exNo").onclick = closeModal;
  $("exCopy").onclick = () => { closeModal(); copyText(toTsv(recordRows()), tr(`${records.length}件をコピーしました。Excelに貼り付けできます`, `已复制${records.length}条，可粘贴到Excel`)) };
  $("exXlsx").onclick = () => { closeModal(); downloadXlsx() };
});

const tsvLine = (a) => a.map(cellText).join("\t");
/* ---- event map: Amap (高德) raster tiles placed by hand, so no map library or API key is needed ---- */
// Amap tiles are GCJ-02 on Web Mercator; stored positions are WGS84, so convert inside China like the Amap link does
const TILE = 256, MINZ = 3, MAXZ = 18;
const tileUrl = (x, y, z) => `https://webrd0${1 + (x + y) % 4}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=${x}&y=${y}&z=${z}`;
const toGcj = (r) => inChina(r.lat, r.lon) ? wgsToGcj(r.lat, r.lon) : { lat: r.lat, lon: r.lon };
// position → pixel coordinates of the whole world at zoom 0
function project(p) {
  const s = Math.sin(Math.max(-85, Math.min(85, p.lat)) * Math.PI / 180);
  return { x: TILE * (p.lon + 180) / 360, y: TILE * (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) };
}
const map = { pts: [], z: 4, cx: TILE / 2, cy: TILE / 2, sel: null }; // cx, cy: centre in zoom-0 pixels
const mapImgs = new Map();
function renderMap(list) {
  map.pts = list.filter(r => r.lat != null && r.lon != null).map(r => ({ r, ...project(toGcj(r)) }));
  if (!map.pts.some(p => p.r.id === map.sel)) map.sel = null;
  const noPos = list.length - map.pts.length;
  $("mapCount").textContent = map.pts.length ? tr(`${map.pts.length}件`, `${map.pts.length}条`) : "";
  $("mapLegend").innerHTML = CATS.map(c => [c, map.pts.filter(p => p.r.cat === c.id).length]).filter(([, n]) => n)
    .map(([c, n]) => `<span><i style="background:var(--${c.id})"></i>${esc(L(c.name))} ${n}</span>`).join("")
    + (noPos ? `<span>${tr(`位置なし ${noPos}件（地図に出ません）`, `无位置 ${noPos}条（不显示在地图上）`)}</span>` : "");
  $("map").innerHTML = ""; // rebuild the controls so their labels follow the language
  fitMap(); drawMap(); renderMapInfo();
}
function fitMap() {
  const el = $("map"), w = el.clientWidth - 60, h = el.clientHeight - 60;
  if (!map.pts.length || w <= 0) return;
  const xs = map.pts.map(p => p.x), ys = map.pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  let z = 16;
  while (z > MINZ && ((x1 - x0) * 2 ** z > w || (y1 - y0) * 2 ** z > h)) z--;
  Object.assign(map, { z, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 });
}
function drawMap() {
  const el = $("map"), w = el.clientWidth, h = el.clientHeight;
  if (!map.pts.length) {
    mapImgs.clear();
    el.innerHTML = `<div class="msg">${tr("位置のある記録がありません。記録時に位置が取れた記録がここに表示されます。", "没有带位置的记录。记录时获取到位置的记录会显示在这里。")}</div>`;
    return;
  }
  if (!el.querySelector(".zoom")) {
    mapImgs.clear();
    el.innerHTML = `<div class="tiles"></div><div class="pins"></div>
      <div class="zoom"><button type="button" data-z="1" aria-label="${tr("拡大", "放大")}">＋</button><button type="button" data-z="-1" aria-label="${tr("縮小", "缩小")}">−</button><button type="button" class="fit" data-z="fit">${tr("全体", "全部")}</button></div>
      <div class="offline" hidden>${tr("オフライン：表示済みの範囲のみ地図が出ます", "离线：仅显示加载过的地图范围")}</div>
      <div class="credit">© 高德地图</div>`;
  }
  if (!w) return;
  const n = 2 ** map.z, ox = map.cx * n - w / 2, oy = map.cy * n - h / 2, tiles = el.querySelector(".tiles"), keep = new Set();
  for (let ty = Math.max(0, Math.floor(oy / TILE)); ty < n && ty * TILE < oy + h; ty++) {
    for (let tx = Math.floor(ox / TILE); tx * TILE < ox + w; tx++) {
      const key = `${map.z}/${tx}/${ty}`; keep.add(key);
      let img = mapImgs.get(key);
      if (!img) { img = new Image(); img.alt = ""; img.onerror = () => img.style.visibility = "hidden"; img.src = tileUrl((tx % n + n) % n, ty, map.z); tiles.appendChild(img); mapImgs.set(key, img) }
      img.style.left = tx * TILE - ox + "px"; img.style.top = ty * TILE - oy + "px";
    }
  }
  for (const [key, img] of mapImgs) if (!keep.has(key)) { img.remove(); mapImgs.delete(key) }
  el.querySelector(".offline").hidden = navigator.onLine;
  // selected pin last so it sits on top
  const pts = [...map.pts].sort((a, b) => (a.r.id === map.sel) - (b.r.id === map.sel));
  el.querySelector(".pins").innerHTML = pts.map(p => `<button type="button" class="pin${p.r.id === map.sel ? " sel" : ""}" data-c="${p.r.cat}" data-id="${p.r.id}"
    style="left:${(p.x * n - ox).toFixed(1)}px;top:${(p.y * n - oy).toFixed(1)}px" title="No.${records.indexOf(p.r) + 1} ${esc(L(catOf(p.r.cat).name))} ${esc(L(p.r.sub))}${p.r.memo ? " " + esc(p.r.memo) : ""}"></button>`).join("");
}
function renderMapInfo() {
  const r = records.find(x => x.id === map.sel), box = $("mapInfo");
  box.hidden = !r; if (!r) return;
  const c = catOf(r.cat);
  box.innerHTML = `<b>No.${records.indexOf(r) + 1}</b><span>${esc(L(c.name))}</span><span class="rate" data-v="${esc(r.sub)}">${esc(L(r.sub)) || "—"}</span>
    <span>${fmtDate(r.t)} ${fmtTime(r.t)}</span>${r.car ? `<span>${esc(r.car)}</span>` : ""}${r.scene ? `<span>${esc(L(r.scene))}</span>` : ""}
    ${r.memo ? `<span>${esc(r.memo)}</span>` : ""}${mapLinks(r)}`;
}
function selectPin(id) { map.sel = id; drawMap(); renderMapInfo() }
function panMap(dx, dy) {
  const n = 2 ** map.z;
  map.cx -= dx / n; map.cy = Math.max(0, Math.min(TILE, map.cy - dy / n));
  drawMap();
}
// zoom by dz whole levels, keeping the point (px, py) inside the map where it is
function zoomMap(dz, px, py) {
  const el = $("map"), z = Math.max(MINZ, Math.min(MAXZ, map.z + dz));
  if (z === map.z) return;

  toast(tr("オフラインのため高徳地図を開けません", "离线中，无法打开高德地图"));
});
// ask the browser not to clear the records when storage runs low
try { navigator.storage?.persist?.().catch(() => {}) } catch {}
if ("serviceWorker" in navigator) {
  // A new version is applied by reloading when the app opens or comes back to the front. If that would throw
  // away something in progress (a record being filled in, an open dialog, text being typed), or the version
  // arrived mid-use when the connection returned, nothing is shown and it waits for the next open.
  const busy = () => draft || !$("modal").hidden || document.activeElement?.matches("input, textarea");
  let pending = false, trigger = "open";
  const apply = () => {
    if (!pending || busy()) return;
    try { sessionStorage.setItem("drive-event-logger-updated", "1") } catch {}
    location.reload();
  };
  const arrived = () => { pending = true; if (trigger !== "online") apply() };
  try { if (sessionStorage.getItem("drive-event-logger-updated")) { sessionStorage.removeItem("drive-event-logger-updated"); setTimeout(() => toast(tr("最新版に更新しました", "已更新到最新版本")), 300) } } catch {}
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", (e) => { if (e.data === "updated") arrived() });
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) arrived() });
  const check = (t) => { trigger = t; navigator.serviceWorker.controller?.postMessage("check") };
  // check at launch, when the installed app comes back to the front, and when the connection returns
  check("open");
  addEventListener("online", () => check("online"));
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { apply(); check("front") } });
}

applyLang();
</script>
