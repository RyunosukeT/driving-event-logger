<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>走行評価イベントロガー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column cockpit. Sticky status bar, big tap targets (step 1 → 2 → 3), then the log table. */
:root {
  --bg: #eef1f3; --panel: #ffffff; --fg: #15202b; --muted: #5b6875; --line: #d3dae0;
  --accent: #0a6c8a; --accent-ink: #ffffff;
  --safe: #c62f2f; --eff: #c47a00; --viol: #3a4fb8; --una: #9c3d8f; --oth: #4f5d6b;
  --ok: #1d7a46; --warn: #b26b00; --bad: #b3261e;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1418; --panel: #182027; --fg: #e6ecf0; --muted: #94a2ae; --line: #2b3640;
  --accent: #3fb3d6; --accent-ink: #06151b;
  --safe: #ef5a5a; --eff: #f0a62a; --viol: #7f90f0; --una: #d77ccb; --oth: #7d8d9c;
  --ok: #4cc17f; --warn: #f0a62a; --bad: #ef5a5a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #182027; --fg: #e6ecf0; --muted: #94a2ae; --line: #2b3640;
  --accent: #3fb3d6; --accent-ink: #06151b;
  --safe: #ef5a5a; --eff: #f0a62a; --viol: #7f90f0; --una: #d77ccb; --oth: #7d8d9c;
  --ok: #4cc17f; --warn: #f0a62a; --bad: #ef5a5a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 88px; display: grid; gap: 16px }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px }
header .in { max-width: 860px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px }
h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .02em; margin-right: auto }
.clock { font-family: var(--font-mono); font-size: 18px; font-variant-numeric: tabular-nums }
.gps { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted) }
.gps[data-s="ok"] .dot { background: var(--ok) } .gps[data-s="weak"] .dot { background: var(--warn) } .gps[data-s="none"] .dot { background: var(--bad) }
.wrap > * { min-width: 0 }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px }
.grid { display: grid; gap: 10px }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)) }
.g5 { grid-template-columns: repeat(5, minmax(0,1fr)) }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)) }
.gs { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)) }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel) }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.in2 { max-width: 860px; margin: 8px auto 0 }
#car { min-height: 38px; padding: 6px 10px; flex: 1 1 auto; min-width: 0 }
.carrow { display: flex; gap: 8px; align-items: stretch }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none }
.tabs button { border: 0; border-radius: 0; padding: 0 14px; font-weight: 600; min-height: 38px; background: var(--panel); color: var(--muted) }
.tabs button.on { background: var(--accent); color: var(--accent-ink) }
#sumView .grid > * { min-width: 0 }
.filters { display: flex; flex-wrap: wrap; gap: 10px }
.filters label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; flex: 1 1 160px; min-width: 0 }
.sumhead { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 10px }
.sumhead .label { margin: 0 }
table.sum td.n, table.sum th.n { text-align: right; font-family: var(--font-mono); font-size: 12px }
table.sum td.z { color: var(--muted) }
table.sum th.grp { text-align: center; border-left: 1px solid var(--line) }
table.sum .bl { border-left: 1px solid var(--line) }
table.sum tr.total td { font-weight: 700; background: var(--bg) }
table.sum td.t, table.sum th.t { font-weight: 700 }
.map { position: relative; height: 340px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #e8e4da; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab }
.map.drag { cursor: grabbing }
.map img { position: absolute; width: 256px; height: 256px; max-width: none; pointer-events: none }
.map .pin { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; padding: 0; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.45); cursor: pointer }
.map .pin.sel { width: 26px; height: 26px; margin: -13px 0 0 -13px; z-index: 2; outline: 3px solid var(--fg); outline-offset: 1px }
.pin[data-c="safe"] { background: var(--safe) } .pin[data-c="eff"] { background: var(--eff) } .pin[data-c="viol"] { background: var(--viol) } .pin[data-c="una"] { background: var(--una) } .pin[data-c="oth"] { background: var(--oth) }
.map .zoom { position: absolute; right: 8px; top: 8px; z-index: 3; display: grid; gap: 6px }
.map .zoom button { width: 38px; height: 38px; padding: 0; font-size: 18px; font-weight: 700; background: var(--panel); box-shadow: 0 1px 4px rgba(0,0,0,.25) }
.map .zoom button.fit { font-size: 12px }
.map .credit { position: absolute; right: 0; bottom: 0; z-index: 3; font-size: 10px; padding: 1px 6px; background: rgba(255,255,255,.75); color: #333 }
.map .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--muted); background: var(--panel); z-index: 4 }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted) }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px }
.mapinfo { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--bg); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-variant-numeric: tabular-nums }
.mapinfo a { color: var(--accent) }
.cat { min-height: 72px; font-size: 18px; font-weight: 700; border: 0; color: #fff; display: grid; place-items: center; line-height: 1.2; padding: 8px }
.cat small { display: none }
.cat[data-c="safe"] { background: var(--safe) } .cat[data-c="eff"] { background: var(--eff) } .cat[data-c="viol"] { background: var(--viol) } .cat[data-c="una"] { background: var(--una) } .cat[data-c="oth"] { background: var(--oth) }
:root[data-theme="dark"] .cat, :root:not([data-theme="light"]) .cat { color: #fff }
.cat:active { transform: scale(.97) }
.cat .nb { display: none }
.opt { min-height: 60px; font-size: 16px; font-weight: 600; padding: 8px }
.opt.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.cur { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; padding: 10px 12px; border-radius: 8px; background: var(--bg); margin-bottom: 12px; font-variant-numeric: tabular-nums }
.cur b { font-size: 17px }
.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; color: #fff }
.chip[data-c="safe"] { background: var(--safe) } .chip[data-c="eff"] { background: var(--eff) } .chip[data-c="viol"] { background: var(--viol) } .chip[data-c="una"] { background: var(--una) } .chip[data-c="oth"] { background: var(--oth) }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.btn { padding: 10px 16px; font-weight: 600; min-height: 44px }
.btn.sm { padding: 6px 12px; min-height: 36px; font-size: 13px }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--bad); border-color: var(--bad) }
.btn.ghost { background: transparent }
input[type=text], select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 44px; width: 100% }
.memo { flex: 1 1 220px; min-width: 0 }
.step + .step { margin-top: 14px }
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel) }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); position: sticky; top: 0 }
td.num { font-family: var(--font-mono); font-size: 12px }
td.memo-c { white-space: normal; min-width: 140px }
tr.pending td { background: color-mix(in srgb, var(--warn) 12%, transparent) }
td a { color: var(--accent) }
.act button { padding: 6px 10px; font-size: 12px; min-height: 34px }
.empty { padding: 24px; text-align: center; color: var(--muted) }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px) }
.modal { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, #000 45%, transparent); display: grid; place-items: center; padding: 16px }
.modal .box { background: var(--panel); border-radius: 10px; padding: 16px; width: min(440px, 100%); display: grid; gap: 12px; max-height: 90%; overflow: auto }
.modal .box > .btn { width: 100% }
.modal label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600 }
textarea#impText { width: 100%; height: 160px; font-family: var(--font-mono); font-size: 12px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px }
.langbtn { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  min-height: 44px; padding: 0 16px; border-radius: 99px; font-weight: 700; background: var(--panel); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 2px 10px color-mix(in srgb, #000 18%, transparent) }
html:lang(zh-CN) body { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", system-ui, sans-serif }
.note { font-size: 12px; color: var(--muted); margin: 0 }
textarea#fallback { width: 100%; height: 120px; font-family: var(--font-mono); font-size: 12px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px }
@media (max-width: 420px) { .cat { min-height: 64px; font-size: 16px; padding: 4px } .cat .nb { display: inline } #cats { gap: 6px } .cat small { display: none } h1 { font-size: 14px } .clock { font-size: 15px } .gs { grid-template-columns: repeat(2, minmax(0,1fr)) } }
@media (prefers-reduced-motion: reduce) { .cat:active { transform: none } }
</style>

</head><body>
<header><div class="in">
  <h1 data-zh="行驶评价事件记录">走行評価イベントロガー</h1>
  <span class="gps" id="gps" data-s="wait"><span class="dot"></span><span id="gpsText"></span></span>
  <span class="clock" id="clock">--:--:--</span>
</div>
<div class="in2 carrow"><input type="text" id="car" placeholder="車名（この後の記録に付きます）" data-zh-ph="车名（附加到之后的记录）" autocomplete="off" aria-label="車名">
  <nav class="tabs" id="tabs"><button data-v="log" class="on" aria-pressed="true" data-zh="记录">記録</button><button data-v="sum" aria-pressed="false" data-zh="统计">集計</button></nav></div>
<div class="in2" id="stepCat">
  <div class="grid g5" id="cats"></div>
</div></header>

<div class="wrap">

  <section class="panel" id="stepDetail" hidden>
    <div class="cur" id="curInfo"></div>
    <div class="step">
      <p class="label" data-zh="② 详细">② 詳細</p>
      <div class="grid gs" id="subs"></div>
    </div>
    <div class="step" id="stepRoad">
      <p class="label" data-zh="③ 道路">③ 道路</p>
      <div class="grid g2" id="roads"></div>
    </div>
    <div class="step" id="stepScene">
      <p class="label" data-zh="④ 场景">④ シーン</p>
      <div class="grid gs" id="scenes"></div>
    </div>
    <div class="step row">
      <input type="text" id="memo" class="memo" placeholder="メモ（任意）" data-zh-ph="备注（可选）" autocomplete="off">
      <button class="btn primary" id="done" data-zh="确认记录">記録を確定</button>
      <button class="btn danger ghost" id="cancel" data-zh="取消">取り消す</button>
    </div>
    <p class="note" style="margin-top:10px" data-zh="按下「确认记录」之前不会保存。未确认就切换分类按钮或标签页时，正在输入的内容会被丢弃。">「記録を確定」を押すまでは記録されません。確定せずに分類ボタンやタブを切り替えると、入力中の内容は破棄されます。</p>
  </section>

  <section id="logView">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <p class="label" style="margin:0"><span data-zh="记录列表">記録一覧</span> <span id="count"></span></p>
      <div class="row">
        <button class="btn primary" id="copy" data-zh="导出">エクスポート</button>
        <button class="btn sm" id="import" data-zh="导入">取込</button>
        <button class="btn danger ghost" id="clearAll" data-zh="全部删除">全削除</button>
      </div>
    </div>
    <div class="tablebox"><table>
      <thead><tr><th>No</th><th data-zh="日期">日付</th><th data-zh="时间">時刻</th><th data-zh="车名">車名</th><th data-zh="分类">分類</th><th data-zh="详细">詳細</th><th data-zh="道路">道路</th><th data-zh="场景">シーン</th><th data-zh="地图">地図</th><th data-zh="备注">メモ</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
  </section>

  <section id="sumView" hidden>
    <div class="grid" style="gap:16px">
      <div class="filters">
        <label><span data-zh="日期">日付</span><select id="fDate"></select></label>
        <label><span data-zh="道路">道路</span><select id="fRoad"></select></label>
        <label><span data-zh="车名">車名</span><select id="fCar"></select></label>
      </div>
      <section class="panel">
        <div class="sumhead"><p class="label"><span data-zh="事件地点地图">イベント地点の地図</span> <span id="mapCount"></span></p></div>
        <div class="map" id="map"></div>
        <div class="legend" id="mapLegend"></div>
        <div class="mapinfo" id="mapInfo" hidden></div>
      </section>
      <section class="panel">
        <div class="sumhead"><p class="label"><span data-zh="按日期・车名统计">日付・車名別の件数</span> <span id="sumCount"></span></p><button class="btn primary" id="copySum1" data-zh="复制表格">表をコピー</button></div>
        <div class="tablebox"><table class="sum" id="sum1"></table></div>
      </section>
      <section class="panel">
        <div class="sumhead"><p class="label" data-zh="按场景统计">シーン別の件数</p><button class="btn primary" id="copySum2" data-zh="复制表格">表をコピー</button></div>
        <div class="tablebox"><table class="sum" id="sum2"></table></div>
      </section>
    </div>
  </section>
  <textarea id="fallback" hidden readonly aria-label="コピー用テキスト"></textarea>
</div>

<button class="langbtn" id="lang" type="button" aria-label="言語切替 / 切换语言"></button>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const CATS = [
  { id: "safe", name: "安全T/O", subs: ["危険度-高", "危険度-中", "危険度-低"] },
  { id: "eff",  name: "効率T/O", subs: ["発進しない", "加速しない", "車線間違い"] },
  { id: "viol", name: "交通違反", subs: ["信号無視", "実線を踏む", "速度超過", "歩行者保護違反"] },
  { id: "una",  name: "不要作動", subs: ["不要減速", "不要加速", "不要操舵"] },
  { id: "oth",  name: "その他", subs: ["計測開始", "計測終了", "システム退出", "システム降級", "システム起動", "その他"], noScene: true }, // no road / scene step
];
const ROADS = ["高速道", "一般道"];
const SCENES = ["巡行", "発進・加速", "減速", "右折", "左折", "Uターン", "合流・分岐", "ナビLC", "追い越し", "主動回避", "受動回避", "横断", "ラウンドアバウト"];
// scene names used by earlier versions, mapped to their current names
const SCENE_RENAMES = { "巡行・発進": "巡行", "追従加速": "発進・加速", "割り込まれ": "受動回避", "ナビレーンチェンジ": "ナビLC" };
// detail names used by earlier versions (Japanese and Chinese), mapped to their current names
const SUB_RENAMES = { "危険度 高": "危険度-高", "危険度 中": "危険度-中", "危険度 低": "危険度-低", "危险度 高": "危険度-高", "危险度 中": "危険度-中", "危险度 低": "危険度-低" };
// Records always store the Japanese names; ZH translates them (and fixed labels) for display.
const ZH = {
  "安全T/O": "安全接管", "効率T/O": "效率接管", "交通違反": "交通违规", "不要作動": "误动作", "その他": "其他",
  "危険度-高": "危险度-高", "危険度-中": "危险度-中", "危険度-低": "危险度-低",
  "発進しない": "不起步", "加速しない": "不加速", "車線間違い": "车道错误",
  "信号無視": "闯红灯", "実線を踏む": "压实线", "速度超過": "超速", "歩行者保護違反": "未礼让行人",
  "不要減速": "误减速", "不要加速": "误加速", "不要操舵": "误转向",
  "計測開始": "测试开始", "計測終了": "测试结束", "システム退出": "系统退出", "システム降級": "系统降级", "システム起動": "系统启动",
  "高速道": "高速公路", "一般道": "普通道路",
  "巡行": "巡航", "発進・加速": "起步・加速", "減速": "减速", "右折": "右转", "左折": "左转", "Uターン": "掉头",
  "合流・分岐": "汇入・汇出", "ナビLC": "导航变道", "追い越し": "超车", "主動回避": "主动避让", "受動回避": "被动避让",
  "横断": "横穿", "ラウンドアバウト": "环岛",
};
const FROM_ZH = Object.fromEntries(Object.entries(ZH).map(([ja, zh]) => [zh, ja]));
const KEY = "drive-event-logger-v1";
const CAR_KEY = "drive-event-logger-car";
const LANG_KEY = "drive-event-logger-lang";
const $ = (id) => document.getElementById(id);

let lang = "ja";
try { if (localStorage.getItem(LANG_KEY) === "zh") lang = "zh" } catch {}
const tr = (ja, zh) => lang === "zh" ? zh : ja;        // fixed UI text
const L = (v) => lang === "zh" ? (ZH[v] ?? v) : v;      // stored category/detail/road/scene names

let records = load();
records.forEach(r => { delete r.acc; delete r.lag; if (SCENE_RENAMES[r.scene]) r.scene = SCENE_RENAMES[r.scene]; if (SUB_RENAMES[r.sub]) r.sub = SUB_RENAMES[r.sub] });
let draft = null;     // record being filled in; joins records only on 記録を確定
let fix = null;       // latest GeolocationPosition

function load() { try { return JSON.parse(localStorage.getItem(KEY) || "[]") } catch { return [] } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(records)) } catch { toast(tr("この端末では保存できません（プライベートモード等）", "此设备无法保存（无痕模式等）")) } }
const pad = (n) => String(n).padStart(2, "0");
const fmtDate = (t) => { const d = new Date(t); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}` };
const fmtTime = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` };
const catOf = (id) => CATS.find(c => c.id === id);
// Amap uses GCJ-02. Inside mainland China convert WGS84 → GCJ-02 here (standard formula)
// instead of relying on Amap's own conversion; outside China GCJ-02 is WGS84 unchanged.
const inChina = (lat, lon) => !(lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271);
function wgsToGcj(lat, lon) {
  const a = 6378245.0, ee = 0.00669342162296594323, PI = Math.PI, x = lon - 105, y = lat - 35;
  let dLat = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x))
    + (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3
    + (20 * Math.sin(y * PI) + 40 * Math.sin(y / 3 * PI)) * 2 / 3
    + (160 * Math.sin(y / 12 * PI) + 320 * Math.sin(y * PI / 30)) * 2 / 3;
  let dLon = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x))
    + (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3
    + (20 * Math.sin(x * PI) + 40 * Math.sin(x / 3 * PI)) * 2 / 3
    + (150 * Math.sin(x / 12 * PI) + 300 * Math.sin(x / 30 * PI)) * 2 / 3;
  const rad = lat / 180 * PI, m = 1 - ee * Math.sin(rad) ** 2, sm = Math.sqrt(m);
  const gLat = lat + dLat * 180 / ((a * (1 - ee)) / (m * sm) * PI);
  const gLon = lon + dLon * 180 / (a / sm * Math.cos(rad) * PI);
  return { lat: gLat, lon: gLon };
}
// GCJ-02 → WGS84 by fixed-point iteration (sub-metre), for import
function gcjToWgs(lat, lon) {
  if (!inChina(lat, lon)) return { lat, lon };
  let w = { lat, lon };
  for (let i = 0; i < 10; i++) { const f = wgsToGcj(w.lat, w.lon); w = { lat: w.lat + lat - f.lat, lon: w.lon + lon - f.lon } }
  return { lat: +w.lat.toFixed(7), lon: +w.lon.toFixed(7) };
}
// BD-09 → GCJ-02 exactly, then GCJ-02 → WGS84; for Baidu links in copies made by earlier versions
function bdToWgs(lat, lon) {
  const X = Math.PI * 3000 / 180, x = lon - 0.0065, y = lat - 0.006;
  const z = Math.sqrt(x * x + y * y) - 0.00002 * Math.sin(y * X), th = Math.atan2(y, x) - 0.000003 * Math.cos(x * X);
  return gcjToWgs(z * Math.sin(th), z * Math.cos(th));
}
// position from a copied Amap (or older Baidu) link (the copy no longer carries latitude/longitude columns)
function posFromLink(url) {
  const a = String(url).match(/position=(-?[\d.]+),(-?[\d.]+)/);
  if (a) return /coordinate=wgs84/.test(url) ? { lat: +a[2], lon: +a[1] } : gcjToWgs(+a[2], +a[1]);
  const m = String(url).match(/location=(-?[\d.]+),(-?[\d.]+)&coord_type=(\w+)/); if (!m) return null;
  const lat = +m[1], lon = +m[2];
  return m[3] === "bd09ll" ? bdToWgs(lat, lon) : { lat, lon };
}
function amapUrl(r) {
  const g = inChina(r.lat, r.lon) ? wgsToGcj(r.lat, r.lon) : { lat: r.lat, lon: r.lon };
  const name = encodeURIComponent(`${L(catOf(r.cat).name)} ${L(r.sub) || ""} ${fmtDate(r.t)} ${fmtTime(r.t)}${r.car ? " " + r.car : ""}`.replace(/ +/g, " "));
  return `https://uri.amap.com/marker?position=${g.lon.toFixed(6)},${g.lat.toFixed(6)}&name=${name}&coordinate=gaode&callnative=0&src=drivelogger`;
}
const mapLinks = (r) => `<a href="${esc(amapUrl(r))}" target="_blank" rel="noopener">${tr("高徳地図", "高德地图")}</a>`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* ---- language ---- */
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "ja";
  document.querySelectorAll("[data-zh]").forEach(el => { if (el.dataset.ja == null) el.dataset.ja = el.textContent; el.textContent = lang === "zh" ? el.dataset.zh : el.dataset.ja });
  document.querySelectorAll("[data-zh-ph]").forEach(el => { if (el.dataset.jaPh == null) el.dataset.jaPh = el.placeholder; el.placeholder = lang === "zh" ? el.dataset.zhPh : el.dataset.jaPh });
  $("lang").textContent = lang === "zh" ? "日本語" : "中文";
  renderCats(); renderGps(); renderTable();
  if (draft) openDetail();
}
$("lang").addEventListener("click", () => {
  lang = lang === "zh" ? "ja" : "zh";
  try { localStorage.setItem(LANG_KEY, lang) } catch {}
  applyLang();
});

/* ---- car name (kept across reloads, stamped on each new record) ---- */
try { $("car").value = localStorage.getItem(CAR_KEY) || "" } catch {}
$("car").addEventListener("input", () => { try { localStorage.setItem(CAR_KEY, $("car").value) } catch {} });

/* ---- clock & GPS ---- */
setInterval(() => { $("clock").textContent = fmtTime(Date.now()); renderGps() }, 500);

let gpsError = 0; // 0 none, 1 denied, 2 unavailable
function renderGps() {
  const el = $("gps");
  if (!("geolocation" in navigator)) { el.dataset.s = "none"; $("gpsText").textContent = tr("位置情報 非対応", "不支持定位"); return }
  if (gpsError) { el.dataset.s = "none"; $("gpsText").textContent = gpsError === 1 ? tr("位置情報 許可されていません", "定位未授权") : tr("位置情報 取得できません", "无法获取定位"); return }
  if (!fix) { $("gpsText").textContent = tr("位置情報 取得中…", "正在获取定位…"); return }
  const age = (Date.now() - fix.timestamp) / 1000, acc = fix.coords.accuracy;
  el.dataset.s = age < 10 && acc <= 30 ? "ok" : "weak";
  $("gpsText").textContent = `±${Math.round(acc)}m · ${age < 1 ? tr("最新", "最新") : Math.round(age) + tr("秒前", "秒前")}`;
}
if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(
    (p) => { fix = p; gpsError = 0; renderGps() },
    (e) => { gpsError = e.code === 1 ? 1 : 2; renderGps() },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
  );
}
// keep the screen on while logging (ignored where unsupported)
async function wake() { try { await navigator.wakeLock?.request("screen") } catch {} }
document.addEventListener("visibilitychange", () => { if (!document.hidden) wake() });
wake();

// only the position is kept, for the Amap link
function applyFix(rec, p) { rec.lat = +p.coords.latitude.toFixed(7); rec.lon = +p.coords.longitude.toFixed(7) }

/* ---- step 1: category ---- */
// names of 4+ characters break after the 2nd character on phones (交通/違反, 安全/T/O)
const catLabel = (n) => n.length >= 4 ? esc(n.slice(0, 2)) + '<br class="nb">' + esc(n.slice(2)) : esc(n);
function renderCats() {
  $("cats").setAttribute("aria-label", tr("① イベント分類（押した時刻と位置を記録）", "① 事件分类（记录按下时的时间和位置）"));
  $("cats").innerHTML = CATS.map(c => `<button class="cat" data-c="${c.id}" aria-label="${esc(L(c.name))}">${catLabel(L(c.name))}</button>`).join("");
}
$("cats").addEventListener("click", (e) => {
  const b = e.target.closest(".cat"); if (!b) return;
  const t = Date.now();
  const rec = { id: t.toString(36) + Math.random().toString(36).slice(2, 6), t, cat: b.dataset.c, car: $("car").value.trim(), sub: "", road: "", scene: "", memo: "", lat: null, lon: null };
  if (fix && t - fix.timestamp < 15000) applyFix(rec, fix);
  else if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition((p) => {
      if (rec.lat != null) return;
      applyFix(rec, p);
      if (records.includes(rec)) { save(); renderTable() } else if (draft === rec) openDetail();
    }, () => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  }
  draft = rec; // replaces any unconfirmed draft
  if (navigator.vibrate) navigator.vibrate(40);
  openDetail(true);
});

/* ---- step 2/3 ---- */
const optBtns = (list, cur) => list.map(s => `<button class="opt${cur === s ? " sel" : ""}" data-v="${esc(s)}">${esc(L(s))}</button>`).join("");
// scrollToTop: only when the panel opens; picking options must not jump the page back up
function openDetail(scrollToTop = false) {
  const r = draft;
  if (!r) { $("stepDetail").hidden = true; return }
  const c = catOf(r.cat);
  $("stepDetail").hidden = false;
  $("curInfo").innerHTML = `<span class="chip" data-c="${c.id}">${esc(L(c.name))}</span><b>${fmtTime(r.t)}</b><span class="note">No.${records.length + 1} ${r.lat != null ? `· ${mapLinks(r)}` : "· " + tr("位置取得中…", "正在获取位置…")}</span>`;
  $("subs").innerHTML = optBtns(c.subs, r.sub);
  $("stepRoad").hidden = $("stepScene").hidden = !!c.noScene;
  $("roads").innerHTML = optBtns(ROADS, r.road);
  $("scenes").innerHTML = optBtns(SCENES, r.scene);
  $("memo").value = r.memo || "";
  if (!scrollToTop) return;
  const top = $("stepDetail").getBoundingClientRect().top - document.querySelector("header").offsetHeight - 8;
  if (top < 0 || top > innerHeight * 0.6) scrollTo({ top: scrollY + top, behavior: "smooth" });
}
function setField(field, v) {
  const r = draft; if (!r) return;
  r[field] = r[field] === v ? "" : v; openDetail();
  // after a scene is chosen, bring the confirm button into easy reach
  if ((field === "scene" && r.scene) || (field === "sub" && r.sub && catOf(r.cat).noScene)) {
    const b = $("done").getBoundingClientRect();
    if (b.bottom > innerHeight - 24) scrollTo({ top: scrollY + b.bottom - innerHeight + 96, behavior: "smooth" });
  }
}
$("subs").addEventListener("click", (e) => { const b = e.target.closest(".opt"); if (b) setField("sub", b.dataset.v) });
$("roads").addEventListener("click", (e) => { const b = e.target.closest(".opt"); if (b) setField("road", b.dataset.v) });
$("scenes").addEventListener("click", (e) => { const b = e.target.closest(".opt"); if (b) setField("scene", b.dataset.v) });
$("memo").addEventListener("input", () => { if (draft) draft.memo = $("memo").value });
function finish() {
  if (!draft) return;
  records.push(draft); save(); draft = null;
  $("stepDetail").hidden = true; toast(tr("記録しました", "已记录")); renderTable();
}
$("done").addEventListener("click", finish);
$("cancel").addEventListener("click", () => { draft = null; $("stepDetail").hidden = true; toast(tr("取り消しました", "已取消")) });

/* ---- table ---- */
function renderTable() {
  renderSummary();
  $("count").textContent = records.length ? tr(`（${records.length}件）`, `（${records.length}条）`) : "";
  if (!records.length) { $("tbody").innerHTML = `<tr><td colspan="11" class="empty">${tr("まだ記録がありません。上の分類ボタンを押すと、その時刻と位置で1件記録されます。", "还没有记录。按上方的分类按钮，即以当时的时间和位置记录一条。")}</td></tr>`; return }
  $("tbody").innerHTML = records.map((r, i) => {
    const c = catOf(r.cat), pending = !r.sub || (!c.noScene && (!r.road || !r.scene));
    const map = r.lat != null ? mapLinks(r) : "—";
    return `<tr class="${pending ? "pending" : ""}" data-id="${r.id}">
      <td class="num">${i + 1}</td><td class="num">${fmtDate(r.t)}</td><td class="num">${fmtTime(r.t)}</td><td>${esc(r.car) || "—"}</td>
      <td><span class="chip" data-c="${c.id}">${esc(L(c.name))}</span></td><td>${esc(L(r.sub)) || "—"}</td><td>${esc(L(r.road)) || "—"}</td><td>${esc(L(r.scene)) || "—"}</td>
      <td>${map}</td>
      <td class="memo-c">${esc(r.memo)}</td>
      <td class="act"><div class="row" style="flex-wrap:nowrap;gap:6px"><button data-a="edit">${tr("編集", "编辑")}</button><button data-a="del">${tr("削除", "删除")}</button></div></td></tr>`;
  }).join("");
}
$("tbody").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const id = b.closest("tr").dataset.id;
  if (b.dataset.a === "edit") editModal(id);
  else confirmModal(tr("この記録を削除しますか？", "要删除这条记录吗？"), () => { records = records.filter(x => x.id !== id); save(); renderTable() });
});

/* ---- modals ---- */
function closeModal() { $("modal").hidden = true; $("modal").innerHTML = "" }
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal() });
function confirmModal(msg, ok) {
  $("modal").innerHTML = `<div class="box"><b>${esc(msg)}</b><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="mNo">${tr("やめる", "取消")}</button><button class="btn danger" id="mYes">${tr("削除する", "删除")}</button></div></div>`;
  $("modal").hidden = false;
  $("mNo").onclick = closeModal; $("mYes").onclick = () => { ok(); closeModal(); toast(tr("削除しました", "已删除")) };
}
function editModal(id) {
  const r = records.find(x => x.id === id); if (!r) return;
  const opts = (list, v) => `<option value="">${tr("（未選択）", "（未选择）")}</option>` + list.map(s => `<option value="${esc(s)}"${s === v ? " selected" : ""}>${esc(L(s))}</option>`).join("");
  $("modal").innerHTML = `<div class="box">
    <b>${tr(`No.${records.indexOf(r) + 1} を編集`, `编辑 No.${records.indexOf(r) + 1}`)} <span class="note">${fmtDate(r.t)} ${fmtTime(r.t)}</span></b>
    <label>${tr("車名", "车名")}<input type="text" id="eCar" value="${esc(r.car)}"></label>
    <label>${tr("分類", "分类")}<select id="eCat">${CATS.map(c => `<option value="${c.id}"${c.id === r.cat ? " selected" : ""}>${esc(L(c.name))}</option>`).join("")}</select></label>
    <label>${tr("詳細", "详细")}<select id="eSub">${opts(catOf(r.cat).subs, r.sub)}</select></label>
    <label>${tr("道路", "道路")}<select id="eRoad">${opts(ROADS, r.road)}</select></label>
    <label>${tr("シーン", "场景")}<select id="eScene">${opts(SCENES, r.scene)}</select></label>
    <label>${tr("メモ", "备注")}<input type="text" id="eMemo" value="${esc(r.memo)}"></label>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="eNo">${tr("閉じる", "关闭")}</button><button class="btn primary" id="eOk">${tr("保存", "保存")}</button></div></div>`;
  $("modal").hidden = false;
  $("eCat").onchange = () => { $("eSub").innerHTML = opts(catOf($("eCat").value).subs, "") };
  $("eNo").onclick = closeModal;
  $("eOk").onclick = () => {
    r.car = $("eCar").value.trim(); r.cat = $("eCat").value; r.sub = $("eSub").value; r.road = $("eRoad").value; r.scene = $("eScene").value; r.memo = $("eMemo").value;
    save(); renderTable(); closeModal(); toast(tr("保存しました", "已保存"));
  };
}
$("clearAll").addEventListener("click", () => {
  if (!records.length) return;
  confirmModal(tr(`全${records.length}件を削除しますか？（元に戻せません）`, `要删除全部${records.length}条记录吗？（无法恢复）`), () => { records = []; save(); renderTable() });
});

/* ---- copy as TSV (in the current language; import accepts either) ---- */
const HEAD = [["No", "No"], ["日付", "日期"], ["時刻", "时间"], ["車名", "车名"], ["分類", "分类"], ["詳細", "详细"], ["道路", "道路"], ["シーン", "场景"],
  ["メモ", "备注"], ["高徳地図", "高德地图"],
  // not in the copy any more; still read when importing older copies
  ["緯度", "纬度"], ["経度", "经度"], ["Baidu地図", "百度地图"]];
const COPY_COLS = 10;
// empty cells are written as "-" in every copied table (import reads "-" back as empty)
const cellText = (v) => String(v ?? "").replace(/[\t\r\n]+/g, " ").trim() || "-";
// table rows (header first) shared by the clipboard copy and the Excel file
function recordRows() {
  const head = HEAD.slice(0, COPY_COLS).map(h => tr(h[0], h[1]));
  return [head, ...records.map((r, i) => [i + 1, fmtDate(r.t), fmtTime(r.t), r.car, L(catOf(r.cat).name), L(r.sub), L(r.road), L(r.scene), r.memo, r.lat != null ? amapUrl(r) : ""])];
}
const toTsv = (rows) => rows.map(tsvLine).join("\n");
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); $("fallback").hidden = true; toast(okMsg) }
  catch {
    const ta = $("fallback"); ta.value = text; ta.hidden = false; ta.focus(); ta.select();
    let ok = false; try { ok = document.execCommand("copy") } catch {}
    toast(ok ? tr("コピーしました", "已复制") : tr("下の枠を選択してコピーしてください", "请选中下方文本框的内容并复制"));
  }
}
$("copy").addEventListener("click", () => {
  if (!records.length) { toast(tr("記録がありません", "没有记录")); return }
  $("modal").innerHTML = `<div class="box">
    <b>${tr("エクスポート", "导出")}</b>
    <p class="note">${tr(`${records.length}件の記録を出力します。Excelファイルには「記録」「日付・車名別」「シーン別」の3シートが入ります。`, `导出${records.length}条记录。Excel文件包含「记录」「按日期・车名」「按场景」3个工作表。`)}</p>
    <button class="btn primary" id="exXlsx">${tr("Excelファイルをダウンロード", "下载Excel文件")}</button>
    <button class="btn" id="exCopy">${tr("クリップボードにコピー（記録の表）", "复制到剪贴板（记录表）")}</button>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="exNo">${tr("閉じる", "关闭")}</button></div></div>`;
  $("modal").hidden = false;
  $("exNo").onclick = closeModal;
  $("exCopy").onclick = () => { closeModal(); copyText(toTsv(recordRows()), tr(`${records.length}件をコピーしました。Excelに貼り付けできます`, `已复制${records.length}条，可粘贴到Excel`)) };
  $("exXlsx").onclick = () => { closeModal(); downloadXlsx() };
});

/* ---- summary view ---- */
// placeholder keys for empty values; shown through noneLabel()
const NOCAR = "\u0000car", NOROAD = "\u0000road", NOSCENE = "\u0000scene";
const noneLabel = (v) => v === NOCAR ? tr("（車名なし）", "（无车名）") : v === NOROAD ? tr("（道路未選択）", "（未选道路）") : v === NOSCENE ? tr("（シーン未選択）", "（未选场景）") : L(v);
// columns: per category a total plus one per subtype
const COLS = CATS.flatMap(c => [{ cat: c.id, sub: null }, ...c.subs.map(s => ({ cat: c.id, sub: s }))]);
const colLabel = (col) => col.sub == null ? tr("計", "合计") : L(col.sub);
const colHead = (col) => L(catOf(col.cat).name) + " " + colLabel(col);
const countCols = (list) => COLS.map(col => list.filter(r => r.cat === col.cat && (col.sub == null || r.sub === col.sub)).length);
const uniq = (a) => [...new Set(a)];
function setOptions(sel, values, allLabel) {
  const prev = sel.value;
  sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option value="${esc(v)}">${esc(noneLabel(v))}</option>`).join("");
  sel.value = values.includes(prev) ? prev : "";
}
function filtered() {
  const d = $("fDate").value, c = $("fCar").value, rd = $("fRoad").value;
  return records.filter(r => (!d || fmtDate(r.t) === d) && (!c || (r.car || NOCAR) === c) && (!rd || (r.road || NOROAD) === rd));
}
function sumHead(firstCols) {
  const lead = firstCols.map(h => `<th rowspan="2">${h}</th>`).join("");
  return `<thead><tr>${lead}<th rowspan="2" class="n t">${tr("合計", "总计")}</th>${CATS.map(c => `<th class="grp" colspan="${c.subs.length + 1}">${esc(L(c.name))}</th>`).join("")}</tr>
    <tr>${COLS.map(col => `<th class="n${col.sub == null ? " bl t" : ""}">${esc(colLabel(col))}</th>`).join("")}</tr></thead>`;
}
const cell = (n, cls = "") => `<td class="n${n ? "" : " z"}${cls}">${n}</td>`;
function sumRow(lead, list, cls = "") {
  return `<tr class="${cls}">${lead.map(v => `<td>${esc(v)}</td>`).join("")}${cell(list.length, " t")}${countCols(list).map((n, i) => cell(n, COLS[i].sub == null ? " bl t" : "")).join("")}</tr>`;
}
function groups(list = filtered()) {
  const keys = uniq(list.map(r => fmtDate(r.t) + "\u0001" + (r.car || NOCAR))).sort();
  return { list, rows: keys.map(k => { const [d, c] = k.split("\u0001"); return { d, c, items: list.filter(r => fmtDate(r.t) === d && (r.car || NOCAR) === c) } }) };
}
const sceneList = (list) => list.filter(r => !catOf(r.cat).noScene);
function sceneGroups(list) {
  list = sceneList(list);
  return [...SCENES, NOSCENE].map(s => ({ s, items: list.filter(r => (r.scene || NOSCENE) === s) })).filter(g => g.s !== NOSCENE || g.items.length);
}
function renderSummary() {
  if ($("sumView").hidden) return;
  setOptions($("fDate"), uniq(records.map(r => fmtDate(r.t))).sort().reverse(), tr("すべての日付", "全部日期"));
  setOptions($("fRoad"), [...ROADS, NOROAD].filter(v => records.some(r => (r.road || NOROAD) === v)), tr("すべての道路", "全部道路"));

/* ---- event map: Amap (高德) raster tiles placed by hand, so no map library or API key is needed ---- */
// Amap tiles are GCJ-02 on Web Mercator; stored positions are WGS84, so convert inside China like the Amap link does
const TILE = 256, MINZ = 3, MAXZ = 18;

const mapImgs = new Map();
function renderMap(list) {

  const noPos = list.length - map.pts.length;
  $("mapCount").textContent = tr(`（${map.pts.length}件）`, `（${map.pts.length}条）`);
  $("mapLegend").innerHTML = CATS.map(c => [c, map.pts.filter(p => p.r.cat === c.id).length]).filter(([, n]) => n)
    .map(([c, n]) => `<span><i style="background:var(--${c.id})"></i>${esc(L(c.name))} ${n}</span>`).join("")
    + (noPos ? `<span>${tr(`位置なし ${noPos}件（地図に出ません）`, `无位置 ${noPos}条（不显示在地图上）`)}</span>` : "");

}
function fitMap() {

  const xs = map.pts.map(p => p.x), ys = map.pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);

  while (z > MINZ && ((x1 - x0) * 2 ** z > w || (y1 - y0) * 2 ** z > h)) z--;

}
function drawMap() {

    return;
  }
  if (!el.querySelector(".zoom")) {
    mapImgs.clear();
    el.innerHTML = `<div class="tiles"></div><div class="pins"></div>
      <div class="zoom"><button type="button" data-z="1" aria-label="${tr("拡大", "放大")}">＋</button><button type="button" data-z="-1" aria-label="${tr("縮小", "缩小")}">−</button><button type="button" class="fit" data-z="fit">${tr("全体", "全部")}</button></div>
      <div class="credit">© 高德地图</div>`;
  }
  if (!w) return;
  const n = 2 ** map.z, ox = map.cx * n - w / 2, oy = map.cy * n - h / 2, tiles = el.querySelector(".tiles"), keep = new Set();
  for (let ty = Math.max(0, Math.floor(oy / TILE)); ty < n && ty * TILE < oy + h; ty++) {
    for (let tx = Math.floor(ox / TILE); tx * TILE < ox + w; tx++) {

      let img = mapImgs.get(key);
      if (!img) { img = new Image(); img.alt = ""; img.src = tileUrl((tx % n + n) % n, ty, map.z); tiles.appendChild(img); mapImgs.set(key, img) }
      img.style.left = tx * TILE - ox + "px"; img.style.top = ty * TILE - oy + "px";

  for (const [key, img] of mapImgs) if (!keep.has(key)) { img.remove(); mapImgs.delete(key) }

  const pts = [...map.pts].sort((a, b) => (a.r.id === map.sel) - (b.r.id === map.sel));

// one finger drags, two fingers pinch (a whole zoom level per step); a tap on a pin shows that record
const ptrs = new Map();

    zoomMap(ratio > 1 ? 1 : -1, (a.x + b.x) / 2 - rect.left, (a.y + b.y) / 2 - rect.top);

$("map").addEventListener("pointercancel", endPointer);

$("map").addEventListener("click", (e) => {
  const b = e.target.closest(".zoom button"); if (!b) return;
  if (b.dataset.z === "fit") { fitMap(); drawMap() } else zoomMap(+b.dataset.z);

new ResizeObserver(() => drawMap()).observe($("map"));

const CRC_TABLE = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0 });

    const local = new Uint8Array([...u32(0x04034b50), ...common]);
    parts.push(local, name, data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...common, ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), name);
    offset += local.length + name.length + data.length;

  for (const a of all) { out.set(a, p); p += a.length }

    { name: "_rels/.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },

/* ---- import pasted TSV (表をコピー format in either language; matched by header name) ---- */
function parseImport(text) {
  const lines = text.replace(/\r/g, "").split("\n").filter(l => l.trim());
  if (!lines.length) return { error: tr("貼り付けたデータが空です", "粘贴的数据为空") };
  const cells = (l) => l.split("\t").map(v => v.trim().replace(/^"(.*)"$/, "$1"));
  const head = cells(lines[0]);
  const col = (ja) => { const h = HEAD.find(x => x[0] === ja); return head.findIndex(v => v === h[0] || v === h[1]) };
  const need = ["日付", "時刻", "分類"].filter(n => col(n) < 0);
  if (need.length) return { error: tr(`1行目に見出し（${need.join("・")}）が見つかりません。「表をコピー」したデータを見出しごと貼り付けてください`,
    `第1行找不到表头（${need.map(n => HEAD.find(x => x[0] === n)[1]).join("・")}）。请连同表头粘贴「复制表格」的数据`) };
  const num = (v) => v === "" || v == null || isNaN(+v) ? null : +v;
  const ja = (v) => FROM_ZH[v] ?? v;
  const have = new Set(records.map(dupKey));
  const ok = [], bad = []; let dup = 0;
  lines.slice(1).forEach((l, i) => {
    const c = cells(l), get = (n) => { const v = col(n) >= 0 ? c[col(n)] ?? "" : ""; return v === "-" ? "" : v };
    const d = get("日付").match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/), tm = get("時刻").match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    const cat = CATS.find(x => x.name === ja(get("分類")));
    if (!d || !tm || !cat) { bad.push(i + 2); return }
    const t = new Date(+d[1], +d[2] - 1, +d[3], +tm[1], +tm[2], +(tm[3] || 0)).getTime();
    const scene = ja(get("シーン"));
    const r = { id: t.toString(36) + Math.random().toString(36).slice(2, 6), t, cat: cat.id, car: get("車名"), sub: SUB_RENAMES[get("詳細")] || ja(get("詳細")), road: ja(get("道路")),
      scene: SCENE_RENAMES[scene] || scene, memo: get("メモ"), lat: num(get("緯度")), lon: num(get("経度")) };
    if (r.lat == null || r.lon == null) { const pos = posFromLink(get("高徳地図") || get("Baidu地図")); r.lat = pos?.lat ?? null; r.lon = pos?.lon ?? null }

}

function importSummary(r, verb) {
  const n = r.ok.length, bad = r.bad.slice(0, 10).join(", ") + (r.bad.length > 10 ? tr(" ほか", " 等") : "");
  return tr(`${n}件を${verb === "add" ? "追加しました" : "追加できます"}` + (r.dup ? `（重複${r.dup}件は除外）` : "") + (r.bad.length ? `。読めなかった行：${bad}行目` : ""),
    `${verb === "add" ? "已添加" : "可添加"}${n}条` + (r.dup ? `（已排除重复${r.dup}条）` : "") + (r.bad.length ? `。无法读取的行：第${bad}行` : ""));
}
function addImported(r) {
  records = records.concat(r.ok).sort((a, b) => a.t - b.t); save(); renderTable(); closeModal();
  toast(importSummary(r, "add"));
}
$("import").addEventListener("click", () => {
  $("modal").innerHTML = `<div class="box">
    <b>${tr("クリップボードからデータを追加しますか？", "要从剪贴板添加数据吗？")}</b>
    <p class="note">${tr("「表をコピー」したデータ（Excelで編集したものも可）を見出しごとコピーしてから「追加する」を押してください。", "请先连同表头复制「复制表格」的数据（也可以是在Excel中编辑过的），再按「添加」。")}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="cfNo">${tr("いいえ", "否")}</button><button class="btn primary" id="cfYes">${tr("追加する", "添加")}</button></div></div>`;
  $("modal").hidden = false;
  $("cfNo").onclick = closeModal;
  $("cfYes").onclick = async () => {
    let text = null;
    try { text = await navigator.clipboard.readText() } catch {}
    if (!text) { openPasteBox(tr("クリップボードを読み取れませんでした。下の枠に貼り付けてください。", "无法读取剪贴板，请粘贴到下方文本框。")); return }
    const r = parseImport(text);
    if (r.ok && r.ok.length) { addImported(r); return }
    openPasteBox(r.error || (tr("追加できる記録がありません。", "没有可添加的记录。") + (r.dup ? tr(`（重複${r.dup}件）`, `（重复${r.dup}条）`) : "")), text);
  };
});
// fallback: paste by hand when the clipboard can't be read or holds something unexpected
function openPasteBox(msg, text = "") {
  $("modal").innerHTML = `<div class="box">
    <b>${tr("データを取り込む", "导入数据")}</b>
    <p class="note">${tr("「表をコピー」したデータ（Excelで編集したものも可）を、1行目の見出しごと下の枠に貼り付けてください。同じ日時・分類・詳細・車名の記録は重複として取り込みません。", "请将「复制表格」的数据（也可以是在Excel中编辑过的）连同第1行表头粘贴到下方文本框。日期时间、分类、详细、车名都相同的记录视为重复，不会导入。")}</p>
    <textarea id="impText" placeholder="${tr("ここに貼り付け", "粘贴到这里")}" aria-label="${tr("取り込むデータ", "要导入的数据")}"></textarea>
    <p class="note" id="impInfo">${esc(msg)}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="impNo">${tr("閉じる", "关闭")}</button><button class="btn primary" id="impOk" disabled>${tr("追加する", "添加")}</button></div></div>`;
  $("modal").hidden = false;
  let parsed = null;
  const check = () => {
    const v = $("impText").value;
    parsed = v.trim() ? parseImport(v) : null;
    $("impOk").disabled = !(parsed && parsed.ok && parsed.ok.length);
    $("impInfo").textContent = !parsed ? "" : parsed.error ? parsed.error : importSummary(parsed, "can");
  };
  $("impText").addEventListener("input", check);
  $("impNo").onclick = closeModal;
  $("impOk").onclick = () => { if (parsed && parsed.ok && parsed.ok.length) addImported(parsed) };
  if (text) { $("impText").value = text; check(); $("impInfo").textContent = msg }
  $("impText").focus();
}

/* ---- toast ---- */
let tt;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200) }

applyLang();
</script>

</body></html>
